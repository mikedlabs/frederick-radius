<!doctype html><html><head><meta charset="utf8"><meta name="viewport" content="width=440">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&family=Newsreader:opsz,wght@6..72,300;6..72,500&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}
:root{--cream:#EFE8DA;--paper:#FFFDF8;--sand:#E6DECE;--ink:#1A1815;--ink2:#4A4844;--ink3:#6B6459;--line:#D6CDBB;--brick:#A03A22;--gold:#C99632;--green:#1E6B3A;--cool:#2F5470;--plum:#7E2C6F;-- tan:#8B5A2B;--ink9:#0E0F12;}
.serif{font-family:'Fraunces',Georgia,serif}.news{font-family:'Newsreader',Georgia,serif}.sans{font-family:'Inter',system-ui,sans-serif}.grot{font-family:'Space Grotesk','Inter',sans-serif}.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
body{font-family:'Inter',system-ui,sans-serif;width:440px}
.scr{width:440px;min-height:920px;position:relative;overflow:hidden}
.up{text-transform:uppercase;letter-spacing:.16em}.scr{background:linear-gradient(180deg,#F3D9A8 0%,#EFE8DA 26%,#EFE8DA 100%);padding:34px 26px}
  .e{font-size:11px;letter-spacing:.14em;color:var(--ink3)}.h{font-size:34px;margin:4px 0 4px}.ld{font-size:13px;color:var(--ink3);font-style:italic;margin-bottom:8px}
  .sun{position:absolute;top:14px;right:26px;width:64px;height:64px;border-radius:50%;background:radial-gradient(circle,#F6C453,#E59A2B);box-shadow:0 0 40px -4px rgba(229,154,43,.6)}
  .rail{position:relative;margin-top:18px;padding-left:6px}
  .rail:before{content:"";position:absolute;left:54px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,var(--gold),var(--line))}
  .stop{display:grid;grid-template-columns:44px 28px 1fr;gap:12px;align-items:center;margin-bottom:14px}
  .time{font-size:13px;color:var(--ink3);text-align:right}
  .node{width:28px;height:28px;border-radius:50%;background:var(--paper);border:2px solid var(--gold);display:grid;place-items:center;font-size:13px;z-index:2}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:11px 14px;box-shadow:0 4px 12px -6px rgba(20,18,16,.14)}
  .card .k{font-size:9px;letter-spacing:.14em;color:var(--brick)}.card .nm{font-size:17px;margin-top:1px}
  .ft{margin-top:6px;text-align:center;font-size:12px;color:var(--brick);font-weight:600}</style></head><body><div class="scr"><div class="sun"></div><div class="e up">Saturday · your day</div><h1 class="h serif">A perfect Saturday,<br>hour by hour.</h1><div class="ld news">Built from what's open and what's on.</div>
  <div class="rail"><div class="stop"><div class="time mono">8a</div><div class="node" style="--i:0">☕</div><div class="card"><div class="k up">Coffee</div><div class="nm serif">Cafe Nola</div></div></div><div class="stop"><div class="time mono">12p</div><div class="node" style="--i:1">🍽</div><div class="card"><div class="k up">Lunch</div><div class="nm serif">Bentztown</div></div></div><div class="stop"><div class="time mono">3p</div><div class="node" style="--i:2">🌲</div><div class="card"><div class="k up">A walk</div><div class="nm serif">Baker Park</div></div></div><div class="stop"><div class="time mono">5p</div><div class="node" style="--i:3">🎶</div><div class="card"><div class="k up">Alive @ Five</div><div class="nm serif">Carroll Creek</div></div></div><div class="stop"><div class="time mono">8p</div><div class="node" style="--i:4">🍸</div><div class="card"><div class="k up">Nightcap</div><div class="nm serif">Tenth Ward</div></div></div></div><div class="ft">Shuffle the day  ↻</div></div></body></html>
