  - id: kfdk_metars
    name: Frederick Municipal Airport METARs (KFDK)
    owner: NOAA Aviation Weather Center
    url: https://aviationweather.gov/api/data/metar?ids=KFDK&format=json&hours=1
    endpoint_type: rest_json
    format: json
    refresh_cadence: hourly
