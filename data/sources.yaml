  # ---------------------------------------------------------------------------
  # discover-sources batch (2026-05-17)
  #
  # Goal: power a county-wide, location-aware "Live Now" — farmers markets,
  # live events, in-city happenings at businesses, specials, and the
  # things that today only live on Instagram/Facebook. We cannot legally
  # scrape Meta; the durable answer is structured public sources + partner
