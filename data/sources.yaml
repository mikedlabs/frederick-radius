      attribution requirements and is not served by this integration.
    contact: Mapillary developer platform
    status: pending_approval
    last_validated: 2026-07-23
    last_success: null
    schema_file: null
    transform_file: src/lib/integrations/mapillary.ts
    notes: |
      Mapillary's map_features API exposes CV-detected point
      objects with lat/lng; the waste class is object--trash-can
      (verify the exact value + bbox-filter against Frederick at
      activation — Mapillary coverage is itself capture-dependent, so
      do not assume density). Two activation paths, both human-gated:
      (1) PREFERRED — push detections into OSM as amenity=waste_basket;
      the existing overpass.ts pipeline then ingests them into the
      map's "Trash" amenities layer with ZERO new app code; (2) wire
      graph.mapillary.com/map_features directly as a first-party layer
      (needs a transform + token). Pairs with cof_trash_receptacles
      (DPW data remains the most authoritative route). Needs a free
      token; never fabricate pins from low-confidence detections.

      STATUS (2026-05-17): path (2) is VERIFIED + WIRED, but remains
      policy-gated until the attribution/terms review is recorded here.
      src/lib/integrations/mapillary.ts → fetchMapillaryTrash() is
      called server-side in the map page and merged into AppMap's
      amenity layer (extraAmenities prop), so the secret never reaches
      the client. Token verified working; object--trash-can confirmed
      as the class with ~51 detections downtown. Gated ONLY on
      both MAPILLARY_ENABLED=1 and MAPILLARY_TOKEN. The explicit enable
      flag records the policy decision; a stored token alone cannot activate
      collection. mapillaryToken()
      sanitizes a trailing "|" / quotes / whitespace (a hand-pasted
      dotenv value commonly carries that — it was a multi-round red
      herring). PROD: MAPILLARY_TOKEN must be added to Vercel env for
      the live site only after MAPILLARY_ENABLED=1 records the explicit
      activation; absent either setting, fetchMapillaryTrash() returns [].
      Every Mapillary popup names
      and links the source rather than mislabeling it as OpenStreetMap.
