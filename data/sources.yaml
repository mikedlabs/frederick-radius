    status: active
    collection: runtime
    last_validated: 2026-07-23
    last_success: null
    schema_file: null
    transform_file: src/lib/integrations/aviationweather.ts
    notes: |
      Active runtime integration, not a daily-worker source. getKfdkMetar()
      reads the hourly METAR and the AlmanacFooter on /now surfaces a
      dewpoint comfort label ("Sticky" / "Muggy" / "Oppressive" /
      "Very dry") ONLY at the edges of the comfort spectrum — the
      "comfortable" middle band is silent so we don't add noise on a
      normal day.

      The signal it adds over the regional NWS forecast is DEWPOINT,
      which the NWS hourly response doesn't expose cleanly. Dewpoint
      maps to comfort better than temperature: 72°F at 50°F dewpoint
      feels great; 72°F at 70°F dewpoint feels oppressive.

      No API key required (public-domain US federal data). 15-minute
      revalidate cache via next/fetch. Failure is silent —
      getKfdkMetar() returns null and the chip is hidden. Fully
      inert when aviationweather.gov is unreachable.

