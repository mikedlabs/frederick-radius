  # City of Frederick SpiresGIS, ArcGIS REST at                         #
  # spires.cityoffrederick.com/arcgis/rest/services. Pending approval:  #
  # the GIS data page gives an accuracy disclaimer but no explicit      #
  # license or attribution, so production use must be confirmed with    #
