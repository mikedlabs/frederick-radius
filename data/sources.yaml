    endpoint_type: arcgis_rest
    format: geojson
    refresh_cadence: monthly
    license: local government, accuracy disclaimer, confirm attribution with City IT
    contact: Matt Bowman, mbowman@cityoffrederickmd.gov
    status: pending_approval
    last_validated: null
    last_success: null
    schema_file: schemas/cof_parcels.json
    transform_file: transforms/cof_parcels.ts
    notes: |
      First activation candidate. Layer 8 (Tax Parcel) confirmed.
      Schema and transform are drafted and ready; activation is gated
      only on the owner confirming usage and attribution. Authoritative
      parcel polygons with address, zoning, land use, acreage, NAC, and
      school districts. No owner name is exposed by the source.

