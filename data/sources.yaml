# Frederick Radius data source manifest.
#
# This file is the single source of truth for every data source the app
# uses or plans to use. The daily worker only processes rows with
# status: active. Other statuses are intentional gates:
#   active           validated, schema and transform exist, worker runs it
#   scaffold         mapped from code, not yet wired to the worker; its
#                    schema and transform are generated when it is
#                    activated, through the diagnose-failure command
#   pending_approval candidate source, never fetched until a human
#                    promotes it to active
#   pending_review   found in code but needs a policy decision before use
#   broken           known dead source, kept for history
#
# A row may set resolve_json_path. When present the worker fetches url,
# reads that dotted path from the JSON response to get a second URL, then
# fetches and stores that. This supports two step APIs such as NWS.

version: 1

sources:
  # ------------------------------------------------------------------ #
  # Active. The worker fetches, validates, and transforms these daily.  #
  # ------------------------------------------------------------------ #

