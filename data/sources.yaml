    last_validated: 2026-07-28
    last_success: null
    schema_file: null
    transform_file: src/lib/aviation/rotorcraft.ts
    notes: |
      A bounded public ADS-B point query supports the optional helicopter map
      layer. The runtime route clips observations to Frederick County, removes
      registrations and raw ICAO identifiers, omits privacy-flagged aircraft,
      and uses public operator callsigns only inside the server to classify a
      Maryland State Police observation. Trooper status is county-level only;
      no callsign or position reaches the browser. FMH trajectories are reduced
      to a fixed-heliport signal, never a moving aircraft point or a confirmed
      landing. Other helicopter points are delayed and rounded to 0.01 degrees.
      Public ADS-B reception is incomplete, so an empty response is never
      described as grounded or clear.
      ADSB.lol requests that production users make contact before depending on
      the service; no API key is currently required.

