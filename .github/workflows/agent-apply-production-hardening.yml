name: Apply production hardening

on:
  push:
    branches:
      - agent/full-production-hardening-2026-08-01

concurrency:
  group: apply-production-hardening-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[hardening-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: agent/full-production-hardening-2026-08-01
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Apply bounded production fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}\n--- needle ---\n{old}")
              target.write_text(text.replace(old, new, 1))

          # Event details may use committed snapshots and durable database rows,
          # but a visitor request must never start the countywide provider fanout.
          replace_once(
              "src/lib/loaders/liveEvents.ts",
              '  options: { signal?: AbortSignal; deadline?: number } = {},',
              '''  options: {
              signal?: AbortSignal;
              deadline?: number;
              allowNetwork?: boolean;
            } = {},''',
          )
          replace_once(
              "src/lib/loaders/liveEvents.ts",
              '''  if (committedVenueHit) return withVenueThumb(committedVenueHit);

            const sourceBudget = Math.min(''',
              '''  if (committedVenueHit) return withVenueThumb(committedVenueHit);

            // Visitor-facing detail routes explicitly disable network fanout. A
            // newly published event that has not reached the durable archive is
            // incomplete evidence, not a 404 and not permission to keep dozens of
            // provider requests alive after the page deadline.
            if (options.allowNetwork === false) {
              throw new LiveEventLookupIncompleteError(["live-network-disabled"]);
            }

            const sourceBudget = Math.min(''',
          )
          replace_once(
              "src/lib/loaders/liveEvents.spec.ts",
              '''  it("returns a fast provider hit without waiting for a never-settling source", async () => {''',
              '''  it("refuses to start provider fanout when network access is disabled", async () => {
              await expect(
                getLiveCardEventBySlug("unarchived-show-2026-08-02", 90, {
                  allowNetwork: false,
                }),
              ).rejects.toMatchObject({
                name: "LiveEventLookupIncompleteError",
                sources: ["live-network-disabled"],
              });

              expect(mocks.getCachedLiveEvents).not.toHaveBeenCalled();
              expect(mocks.fetchTicketmasterSports).not.toHaveBeenCalled();
              expect(mocks.fetchBandsintownForArtists).not.toHaveBeenCalled();
              expect(mocks.fetchVisitFrederick).not.toHaveBeenCalled();
              expect(mocks.fetchFrederickKeys).not.toHaveBeenCalled();
              expect(mocks.fetchSquarespaceVenueEvents).not.toHaveBeenCalled();
            });

            it("returns a fast provider hit without waiting for a never-settling source", async () => {''',
          )

          replace_once(
              "src/lib/loaders/eventResolver.ts",
              '''export type EventLookupContext = {
              signal: AbortSignal;
              deadline: number;
            };

            type EventResolverSources = {''',
              '''export type EventLookupContext = {
              signal: AbortSignal;
              deadline: number;
            };

            export type EventResolutionPolicy = {
              /** The complete countywide board is background-owned, never visitor-owned. */
              includeUnified?: boolean;
              /** Skip the live lane for arbitrary undated slugs in production. */
              requireDatedLiveSlug?: boolean;
            };

            type EventResolverSources = {''',
          )
          replace_once(
              "src/lib/loaders/eventResolver.ts",
              ''': getLiveCardEventBySlug(slug, 90, context),''',
              ''': getLiveCardEventBySlug(slug, 90, {
                  ...context,
                  allowNetwork: false,
                }),''',
          )
          replace_once(
              "src/lib/loaders/eventResolver.ts",
              '''export async function resolveEventPageBySlugWithSources(
              slug: string,
              now: Date,
              sources: EventResolverSources,
            ): Promise<ResolvedEventPage | null> {''',
              '''export async function resolveEventPageBySlugWithSources(
              slug: string,
              now: Date,
              sources: EventResolverSources,
              policy: EventResolutionPolicy = {},
            ): Promise<ResolvedEventPage | null> {''',
          )
          replace_once(
              "src/lib/loaders/eventResolver.ts",
              '''  const directSources: readonly DirectEventSource[] =
                pastDatedLookup
                  ? ["unified", "ingested"]
                  : ["unified", "live", "ingested"];
''',
              '''  const includeUnified = policy.includeUnified !== false;
              const liveSlugIsEligible =
                policy.requireDatedLiveSlug !== true ||
                slug.startsWith("live-") ||
                eventSlugDay(slug) !== null;
              const directSources: DirectEventSource[] = [];
              if (includeUnified) directSources.push("unified");
              if (!pastDatedLookup && liveSlugIsEligible) directSources.push("live");
              directSources.push("ingested");
''',
          )
          replace_once(
              "src/lib/loaders/eventResolver.ts",
              '''  return resolveEventPageBySlugWithSources(slug, now, DEFAULT_SOURCES);
            }''',
              '''  return resolveEventPageBySlugWithSources(slug, now, DEFAULT_SOURCES, {
                includeUnified: false,
                requireDatedLiveSlug: true,
              });
            }''',
          )
          replace_once(
              "src/lib/loaders/eventResolver.spec.ts",
              '''  it("does not resolve an online-only event with no actionable join URL", async () => {''',
              '''  it("keeps the production policy off the unified board and undated live lane", async () => {
              const loaders = sources();

              await expect(
                resolveEventPageBySlugWithSources(
                  "missing-event",
                  new Date("2026-08-01T12:00:00.000Z"),
                  loaders,
                  {
                    includeUnified: false,
                    requireDatedLiveSlug: true,
                  },
                ),
              ).resolves.toBeNull();
              expect(loaders.unified).not.toHaveBeenCalled();
              expect(loaders.live).not.toHaveBeenCalled();
              expect(loaders.ingested).toHaveBeenCalledOnce();
            });

            it("keeps a dated production link recoverable without assembling the unified board", async () => {
              const loaders = sources({
                live: vi.fn(async () => {
                  throw new Error("live network disabled");
                }),
              });

              await expect(
                resolveEventPageBySlugWithSources(
                  "new-show-2026-08-02",
                  new Date("2026-08-01T12:00:00.000Z"),
                  loaders,
                  {
                    includeUnified: false,
                    requireDatedLiveSlug: true,
                  },
                ),
              ).rejects.toMatchObject({
                name: "EventResolutionUnavailableError",
                sources: ["live"],
              });
              expect(loaders.unified).not.toHaveBeenCalled();
              expect(loaders.live).toHaveBeenCalledOnce();
              expect(loaders.ingested).toHaveBeenCalledOnce();
            });

            it("does not resolve an online-only event with no actionable join URL", async () => {''',
          )

          # Avoid rewriting every active PostGIS row on every cron. Only records
          # whose public fields or lifecycle state changed touch the generated
          # geography and GiST index.
          mirror_path = Path("src/lib/spatial/place-mirror.ts")
          mirror = mirror_path.read_text()
          mirror = mirror.replace(
              '''export type SpatialMirrorSyncResult = {
              upserted: number;''',
              '''export type SpatialMirrorSyncResult = {
              checked: number;
              upserted: number;''',
              1,
          )
          function_pattern = re.compile(
              r'''async function upsertBatch\(\n.*?\n\}\n\nexport async function syncSpatialPlaceMirror''',
              re.S,
          )
          new_function = '''async function upsertBatch(
            sql: TransactionSql,
            batch: readonly SpatialCatalogPlace[],
          ): Promise<number> {
            const payload = JSON.stringify(batch.map(mirrorPayload));
            const changed = await sql<{ slug: string }[]>`
              insert into public.places as target (
                slug,
                name,
                category_slug,
                municipality_slug,
                address,
                city,
                state,
                postal_code,
                source,
                lng,
                lat,
                status,
                deleted_at,
                updated_at
              )
              select
                row.slug,
                row.name,
                row.category_slug,
                row.municipality_slug,
                row.address,
                row.city,
                row.state,
                row.postal_code,
                row.source,
                row.lng,
                row.lat,
                'active',
                null,
                now()
              from jsonb_to_recordset(${payload}::jsonb) as row(
                slug text,
                name text,
                category_slug text,
                municipality_slug text,
                address text,
                city text,
                state text,
                postal_code text,
                source text,
                lng double precision,
                lat double precision
              )
              on conflict (slug) do update set
                name = excluded.name,
                category_slug = excluded.category_slug,
                municipality_slug = excluded.municipality_slug,
                address = excluded.address,
                city = excluded.city,
                state = excluded.state,
                postal_code = excluded.postal_code,
                source = excluded.source,
                lng = excluded.lng,
                lat = excluded.lat,
                status = 'active',
                deleted_at = null,
                updated_at = excluded.updated_at
              where (
                target.name,
                target.category_slug,
                target.municipality_slug,
                target.address,
                target.city,
                target.state,
                target.postal_code,
                target.source,
                target.lng,
                target.lat,
                target.status,
                target.deleted_at
              ) is distinct from (
                excluded.name,
                excluded.category_slug,
                excluded.municipality_slug,
                excluded.address,
                excluded.city,
                excluded.state,
                excluded.postal_code,
                excluded.source,
                excluded.lng,
                excluded.lat,
                excluded.status,
                excluded.deleted_at
              )
              returning target.slug
            `;
            return changed.length;
          }

          export async function syncSpatialPlaceMirror'''
          mirror, count = function_pattern.subn(new_function, mirror, count=1)
          if count != 1:
              raise SystemExit(f"place-mirror.ts: expected one upsertBatch block, found {count}")
          mirror = mirror.replace(
              '''  let retired = 0;
''',
              '''  let retired = 0;
              let changed = 0;
''',
              1,
          )
          mirror = mirror.replace(
              '''        await upsertBatch(
                  sql,
                  catalog.places.slice(offset, offset + MIRROR_BATCH_SIZE),
                );''',
              '''        changed += await upsertBatch(
                  sql,
                  catalog.places.slice(offset, offset + MIRROR_BATCH_SIZE),
                );''',
              1,
          )
          mirror = mirror.replace(
              '''    throw new Error(
                  "The PostGIS place mirror did not match the deployed catalog after sync.",
                );''',
              '''    throw new Error(
                  "The PostGIS place mirror did not match the deployed catalog after sync " +
                    `(expected=${audit.expectedCount}, active=${audit.activeCount}, ` +
                    `missing=${audit.missing.length}, extra=${audit.extra.length}, ` +
                    `coordinate_mismatches=${audit.coordinateMismatches.length}, ` +
                    `missing_locations=${audit.missingLocations.length}).`,
                );''',
              1,
          )
          mirror = mirror.replace(
              '''  return {
                upserted: catalog.count,
                retired,
                audit,
              };''',
              '''  return {
                checked: catalog.count,
                upserted: changed,
                retired,
                audit,
              };''',
              1,
          )
          mirror_path.write_text(mirror)

          replace_once(
              "src/lib/spatial/place-mirror.spec.ts",
              '''    expect(result.audit.current).toBe(true);
                expect(result.upserted).toBe(catalog.count);''',
              '''    expect(result.audit.current).toBe(true);
                expect(result.checked).toBe(catalog.count);
                expect(result.upserted).toBe(0);
                expect(
                  transactionQueries.some((query) => query.includes("is distinct from")),
                ).toBe(true);''',
          )
          replace_once(
              "src/app/api/cron/spatial-places/route.ts",
              '''      upserted: result.upserted,
              retired: result.retired,''',
              '''      checked: result.checked,
              changed: result.upserted,
              upserted: result.upserted,
              retired: result.retired,''',
          )
          replace_once(
              "src/app/api/cron/spatial-places/route.spec.ts",
              '''    mocks.syncSpatialPlaceMirror.mockResolvedValue({
                upserted: 1610,
                retired: 2,''',
              '''    mocks.syncSpatialPlaceMirror.mockResolvedValue({
                checked: 1610,
                upserted: 12,
                retired: 2,''',
          )
          replace_once(
              "src/app/api/cron/spatial-places/route.spec.ts",
              '''      current: true,
                upserted: 1610,
                retired: 2,''',
              '''      current: true,
                checked: 1610,
                changed: 12,
                upserted: 12,
                retired: 2,''',
          )

          # The archive becomes durable soon after the background cache warm,
          # while visitor requests remain isolated from all source fanout.
          replace_once(
              "vercel.json",
              '''      "path": "/api/cron/event-archive",
                  "schedule": "11 */2 * * *"''',
              '''      "path": "/api/cron/event-archive",
                  "schedule": "4,34 * * * *"''',
          )
          replace_once(
              "src/app/api/cron/warm-events/route.ts",
              ''' * /today + /events + /map read assembleUnifiedEvents (unstable_cache, 840s);
               * the /events/[slug] resolver reads getCachedLiveEvents (840s).''',
              ''' * /today + /events + /map read assembleUnifiedEvents (unstable_cache, 840s);
               * the durable event-archive worker reads getCachedLiveEvents (840s).
               * Visitor event details stay on seed/archive/database-only fallbacks and
               * never start this provider fanout.''',
          )
          replace_once(
              "src/app/api/cron/warm-events/route.ts",
              '''  //  - getCachedLiveEvents(90) → compact source pages (/events/[slug])''',
              '''  //  - getCachedLiveEvents(90) → durable event-archive source horizon''',
          )
          replace_once(
              "src/app/api/cron/warm-events/route.ts",
              '''  // the detail horizon prevents a visitor from paying its cold source read.''',
              '''  // the archive horizon keeps durable event identity current without making
              // a visitor pay for a cold source read.''',
          )
          PY

      - name: Install dependencies
        run: npm ci
      - name: Targeted regression tests
        run: >-
          npx vitest run
          src/lib/loaders/eventResolver.spec.ts
          src/lib/loaders/liveEvents.spec.ts
          src/lib/spatial/place-mirror.spec.ts
          src/app/api/cron/spatial-places/route.spec.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Lint changed code
        run: >-
          npx eslint
          src/lib/loaders/eventResolver.ts
          src/lib/loaders/eventResolver.spec.ts
          src/lib/loaders/liveEvents.ts
          src/lib/loaders/liveEvents.spec.ts
          src/lib/spatial/place-mirror.ts
          src/lib/spatial/place-mirror.spec.ts
          src/app/api/cron/spatial-places/route.ts
          src/app/api/cron/spatial-places/route.spec.ts
          src/app/api/cron/warm-events/route.ts
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Commit verified changes and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/agent-apply-production-hardening.yml
          git config user.name "frederick-radius-bot"
          git config user.email "bot@frederickradius.app"
          git add -A
          git commit -m "fix: isolate event details and make spatial sync incremental [hardening-applied]"
          git push origin HEAD:agent/full-production-hardening-2026-08-01
