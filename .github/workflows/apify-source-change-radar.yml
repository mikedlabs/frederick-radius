name: Apify source change radar

# Manual-only until baseline and unchanged behavior are proven on main. This
# workflow can open a review issue, but it cannot edit or publish Radius data.
on:
  workflow_dispatch:
    inputs:
      confirm_live:
        description: "Check all three exact pages (provider ceiling: $0.15)"
        required: true
        type: boolean
        default: false
      initialize_state:
        description: "Allow first ledger creation only after checking Apify account usage"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: apify-source-change-radar
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: APIFY_TOKEN
    steps:
      - name: Checkout without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore private radar state
        id: radar-state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scripts/reports/apify-source-change-radar/state.json
          key: apify-source-change-radar-state-${{ github.run_id }}
          restore-keys: |
            apify-source-change-radar-state-

      - name: Show zero-cost exact-page plan
        run: npm run radar:apify-sources

      - name: Keep live radar state on main
        if: ${{ inputs.confirm_live && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error title=Live radar runs from main only::Choose main so the private budget and fingerprint ledger cannot split across branch-scoped caches."
          exit 1

      - name: Protect the private state and charge ledger
        if: ${{ inputs.confirm_live && !inputs.initialize_state }}
        env:
          RESTORED_STATE_KEY: ${{ steps.radar-state.outputs.cache-matched-key }}
        run: |
          if [ -z "$RESTORED_STATE_KEY" ] || [ ! -f scripts/reports/apify-source-change-radar/state.json ]; then
            echo "::error title=Apify radar state was not restored::Recover the prior state, or check initialize_state only after verifying current Apify account usage."
            exit 1
          fi

      - name: Warn before first ledger initialization
        if: ${{ inputs.confirm_live && inputs.initialize_state && steps.radar-state.outputs.cache-matched-key == '' }}
        run: |
          echo "::warning title=Verify Apify account usage::The workflow fails closed after cache loss. Confirm the account spending limit and current usage before creating a new ledger."

      - name: Run capped exact-page radar
        if: ${{ inputs.confirm_live }}
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          RADAR_INITIALIZE_STATE: ${{ inputs.initialize_state }}
        run: |
          if [ -z "$APIFY_TOKEN" ]; then
            echo "::error title=Missing APIFY_TOKEN::Add the token to the dedicated APIFY_TOKEN GitHub environment."
            exit 1
          fi
          set -o pipefail
          if [ "$RADAR_INITIALIZE_STATE" = "true" ]; then
            npm run radar:apify-sources -- --live --confirm --initialize-state 2>&1 | tee apify-source-change-radar.log
          else
            npm run radar:apify-sources -- --live --confirm 2>&1 | tee apify-source-change-radar.log
          fi

      - name: Add safe result to job summary
        if: always()
        run: |
          if [ -f scripts/reports/apify-source-change-radar/github-summary.md ]; then
            cat scripts/reports/apify-source-change-radar/github-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Apify source change radar"
              echo
              echo "No live radar report was produced. Review the failed step above."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open or update the review queue issue
        if: ${{ always() && inputs.confirm_live && hashFiles('scripts/reports/apify-source-change-radar/github-issue.json') != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("node:fs");
            const signalPath = "scripts/reports/apify-source-change-radar/github-issue.json";
            const signal = JSON.parse(fs.readFileSync(signalPath, "utf8"));
            const marker = "<!-- apify-source-change-radar -->";
            const title = "[source-radar] First-party venue pages need review";
            if (
              signal?.schemaVersion !== 1 ||
              signal?.marker !== marker ||
              signal?.title !== title ||
              !Array.isArray(signal?.items) ||
              signal.items.length > 3 ||
              typeof signal?.expiresAt !== "string" ||
              !signal?.summary ||
              Boolean(signal.actionable) !== (signal.items.length > 0)
            ) {
              core.setFailed("The radar issue signal failed its safe schema check.");
              return;
            }
            const safe = (value, max = 160) =>
              String(value ?? "")
                .replace(/[|\r\n]/g, " ")
                .slice(0, max);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const openIssues = await github.paginate(
              github.rest.issues.listForRepo,
              { ...context.repo, state: "open", per_page: 100 },
            );
            const existing = openIssues.find(
              (issue) => !issue.pull_request && issue.body?.includes(marker),
            );
            if (!signal.actionable) {
              if (!existing) {
                core.info("No actionable source change and no open radar issue.");
                return;
              }
              const quietBody = [
                marker,
                "## Source radar recovered or returned quiet",
                "",
                `Collected: ${safe(signal.generatedAt, 40)}`,
                `Result: ${Number(signal.summary.baseline ?? 0)} baseline, ${Number(signal.summary.unchanged ?? 0)} unchanged, ${Number(signal.summary.cosmetic ?? 0)} isolated cosmetic, ${Number(signal.summary.changed ?? 0)} changed, ${Number(signal.summary.error ?? 0)} failed.`,
                `Workflow evidence: ${runUrl}`,
                "",
                "No actionable schedule signal remains. Automatic publishing stayed disabled. Closing this review issue; a later actionable run will open a new one.",
              ].join("\n");
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body: quietBody,
              });
              await github.rest.issues.update({
                ...context.repo,
                issue_number: existing.number,
                state: "closed",
                state_reason: "completed",
              });
              return;
            }
            const rows = [];
            for (const item of signal.items) {
              if (
                item.actor !== "apify/website-content-crawler" ||
                !["changed", "error", "warning"].includes(item.status) ||
                !["low", "medium", "high"].includes(item.confidence)
              ) {
                core.setFailed("A radar issue item failed its allowlist check.");
                return;
              }
              const sourceUrl = new URL(item.sourceUrl);
              if (sourceUrl.protocol !== "https:") {
                core.setFailed("A radar issue item used a non-HTTPS source URL.");
                return;
              }
              const warnings = Array.isArray(item.parsingWarnings)
                ? item.parsingWarnings.map((value) => safe(value, 60)).join(", ") || "none"
                : "none";
              const signalText = item.status === "error"
                ? `${safe(item.errorCode, 60)}${item.httpStatus ? ` (HTTP ${Number(item.httpStatus)})` : ""}`
                : `${safe(item.changedFields?.join(", ") || item.status, 100)}; dates ${Number(item.dateCount ?? 0)}, times ${Number(item.timeCount ?? 0)}, event links ${Number(item.eventLinkCount ?? 0)}`;
              rows.push(
                `| [${safe(item.sourceName)}](${sourceUrl.toString()}) | ${safe(item.town, 80)} | ${safe(item.status, 20)} | ${safe(item.confidence, 10)} | ${signalText} | ${warnings} | ${Number(item.canonicalCheck?.committedVenueEventCount ?? 0)} |`,
              );
            }
            const body = [
              marker,
              "## First-party venue source review",
              "",
              "This is a private-fingerprint review signal. It did not copy publisher prose and cannot publish an event.",
              "",
              `Collected: ${safe(signal.generatedAt, 40)}`,
              `Expires: ${safe(signal.expiresAt, 40)}`,
              `Actor: \`apify/website-content-crawler\``,
              `Workflow evidence: ${runUrl}`,
              "",
              "| Source | Town | Status | Confidence | Signal | Parsing warnings | Committed venue events checked |",
              "| --- | --- | --- | --- | --- | --- | --- |",
              ...rows,
              "",
              "Review the original page and canonical venue records. Promote, reject, expire, or correct manually; this queue has no publishing permission.",
            ].join("\n");
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }

      - name: Upload private fingerprint evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apify-source-change-radar-${{ github.run_id }}
          path: |
            apify-source-change-radar.log
            scripts/reports/apify-source-change-radar/apify-source-change-radar-*.json
            scripts/reports/apify-source-change-radar/github-summary.md
            scripts/reports/apify-source-change-radar/github-issue.json
          if-no-files-found: warn
          retention-days: 14

      - name: Save private radar state
        if: ${{ always() && inputs.confirm_live && hashFiles('scripts/reports/apify-source-change-radar/state.json') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scripts/reports/apify-source-change-radar/state.json
          key: apify-source-change-radar-state-${{ github.run_id }}
