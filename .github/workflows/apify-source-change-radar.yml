name: Apify source change radar
run-name: "Apify source radar (${{ github.event_name == 'schedule' && 'live' || inputs.confirm_live && 'live' || 'plan' }})"

# Manual-only until baseline and unchanged behavior are proven on main. This
# workflow can open a review issue, but it cannot edit or publish Radius data.
on:
  workflow_dispatch:
    inputs:
      confirm_live:
        description: "Check all three exact pages (provider ceiling: $0.15)"
        required: true
        type: boolean
        default: false
      initialize_state:
        description: "Allow first ledger creation only after checking Apify account usage"
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: apify-source-change-radar
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: APIFY_TOKEN
    steps:
      - name: Checkout without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore private radar state
        id: radar-state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scripts/reports/apify-source-change-radar/state.json
          key: apify-source-change-radar-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            apify-source-change-radar-state-

      - name: Show zero-cost exact-page plan
        run: npm run radar:apify-sources

      - name: Keep live radar state on main
        if: ${{ inputs.confirm_live || github.event_name == 'schedule' }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error title=Live radar runs from main only::Choose main so the private budget and fingerprint ledger cannot split across branches."
            exit 1
          fi

      - name: Enforce durable monthly live-run ceiling
        id: monthly-budget
        if: ${{ inputs.confirm_live || github.event_name == 'schedule' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const liveRunName = "Apify source radar (live)";
            const now = new Date();
            const month = now.toISOString().slice(0, 7);
            const monthStart = `${month}-01T00:00:00.000Z`;
            const monthStartMs = Date.parse(monthStart);
            const currentAttempt = Number(process.env.GITHUB_RUN_ATTEMPT);
            if (!Number.isInteger(currentAttempt) || currentAttempt < 1) {
              core.setFailed("GitHub did not provide a valid current run attempt; no provider request is allowed.");
              return;
            }
            // Workflow-run history is the durable spend ledger. Unlike a
            // cache entry, it survives a runner dying after the provider call.
            // Pagination is intentionally exhaustive and any API failure stops
            // the job before APIFY_TOKEN is exposed.
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                ...context.repo,
                workflow_id: "apify-source-change-radar.yml",
                per_page: 100,
              },
            );
            let attemptedRuns = 0;
            let currentSeen = false;
            for (const run of runs) {
              if (
                run.display_title !== liveRunName ||
                run.head_branch !== "main"
              ) {
                continue;
              }
              const updatedAtMs =
                typeof run.updated_at === "string"
                  ? Date.parse(run.updated_at)
                  : Number.NaN;
              if (!Number.isFinite(updatedAtMs)) {
                core.setFailed("GitHub returned uncertain timestamp data for a live run; no provider request is allowed.");
                return;
              }
              const runAttempt = Number(run.run_attempt);
              if (!Number.isInteger(runAttempt) || runAttempt < 1) {
                core.setFailed("GitHub returned an uncertain live-run attempt count; no provider request is allowed.");
                return;
              }
              if (updatedAtMs < monthStartMs) continue;
              if (Number(run.id) === Number(context.runId)) {
                currentSeen = true;
                if (runAttempt !== currentAttempt) {
                  core.setFailed("GitHub run history has not indexed the current attempt; no provider request is allowed.");
                  return;
                }
              }
              attemptedRuns += runAttempt;
            }
            if (!currentSeen) {
              core.setFailed("The current live run is absent from durable GitHub history; no provider request is allowed.");
              return;
            }
            const reservedCents = attemptedRuns * 15;
            if (attemptedRuns > 6 || reservedCents > 90) {
              core.setFailed(
                `Monthly Apify radar ceiling reached: ${attemptedRuns} live attempt(s), $${(reservedCents / 100).toFixed(2)} reserved. No provider request is allowed.`,
              );
              return;
            }
            core.setOutput("month", month);
            core.setOutput("attempted-runs", String(attemptedRuns));
            core.info(
              `Durable monthly floor: ${attemptedRuns}/6 live attempt(s), $${(reservedCents / 100).toFixed(2)}/$0.90 reserved.`,
            );

      - name: Protect the private state and fingerprint ledger
        if: ${{ (inputs.confirm_live || github.event_name == 'schedule') && !inputs.initialize_state }}
        env:
          RESTORED_STATE_KEY: ${{ steps.radar-state.outputs.cache-matched-key }}
        run: |
          if [ -z "$RESTORED_STATE_KEY" ] || [ ! -f scripts/reports/apify-source-change-radar/state.json ]; then
            echo "::error title=Apify radar state was not restored::Recover the prior fingerprints, or check initialize_state only after verifying current Apify account usage."
            exit 1
          fi

      - name: Warn before first ledger initialization
        if: ${{ (inputs.confirm_live || github.event_name == 'schedule') && inputs.initialize_state && steps.radar-state.outputs.cache-matched-key == '' }}
        run: |
          echo "::warning title=Verify Apify account usage::The durable run-history gate preserves reservations, but fingerprints require initialization after cache loss. Confirm the account spending limit and current usage first."

      - name: Run capped exact-page radar
        if: ${{ inputs.confirm_live || github.event_name == 'schedule' }}
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          RADAR_INITIALIZE_STATE: ${{ inputs.initialize_state }}
          RADAR_DURABLE_MONTH: ${{ steps.monthly-budget.outputs.month }}
          RADAR_DURABLE_ATTEMPTED_RUNS: ${{ steps.monthly-budget.outputs.attempted-runs }}
        run: |
          if [ -z "$APIFY_TOKEN" ]; then
            echo "::error title=Missing APIFY_TOKEN::Add the token to the dedicated APIFY_TOKEN GitHub environment."
            exit 1
          fi
          set -o pipefail
          if [ "$RADAR_INITIALIZE_STATE" = "true" ]; then
            npm run radar:apify-sources -- --live --confirm --initialize-state 2>&1 | tee apify-source-change-radar.log
          else
            npm run radar:apify-sources -- --live --confirm 2>&1 | tee apify-source-change-radar.log
          fi

      - name: Add safe result to job summary
        if: always()
        env:
          RADAR_LIVE: ${{ inputs.confirm_live || github.event_name == 'schedule' }}
        run: |
          if [ "$RADAR_LIVE" != "true" ]; then
            {
              echo "## Apify source change radar"
              echo
              echo "Plan-only run completed. No provider request was made and no state was written."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ -f scripts/reports/apify-source-change-radar/github-summary.md ]; then
            cat scripts/reports/apify-source-change-radar/github-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Apify source change radar"
              echo
              echo "No live radar report was produced. Review the failed step above."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open or update the review queue issue
        id: review-queue
        if: ${{ always() && (inputs.confirm_live || github.event_name == 'schedule') && hashFiles('scripts/reports/apify-source-change-radar/github-issue.json') != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { updateApifySourceChangeRadarIssue } = require("./scripts/lib/apify-source-change-radar-issue.cjs");
            await updateApifySourceChangeRadarIssue({ github, context, core });

      - name: Upload private fingerprint evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apify-source-change-radar-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            apify-source-change-radar.log
            scripts/reports/apify-source-change-radar/apify-source-change-radar-*.json
            scripts/reports/apify-source-change-radar/github-summary.md
            scripts/reports/apify-source-change-radar/github-issue.json
          if-no-files-found: warn
          retention-days: 14

      - name: Save private radar state
        if: ${{ always() && (inputs.confirm_live || github.event_name == 'schedule') && steps.review-queue.outcome == 'success' && hashFiles('scripts/reports/apify-source-change-radar/state.json') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scripts/reports/apify-source-change-radar/state.json
          key: apify-source-change-radar-state-${{ github.run_id }}-${{ github.run_attempt }}
