name: Refresh official commerce links

# Deterministic, no-LLM discovery of menu, order, reservation, catering, and
# gift-card anchors published by each public food/drink place's official site.
# It never crawls directories and does not ingest menu items, prices, or POS
# data. Changes open as a review PR before they can affect the app.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum official websites to check (1-200)"
        required: false
        default: "80"
      slug:
        description: "Optional exact place slug for a focused refresh"
        required: false
      force:
        description: "Recheck even when commerce links were checked recently"
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: refresh-official-commerce-links
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    outputs:
      artifact_name: ${{ steps.artifact-name.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for JS-only official sites
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium
      - name: Verify deterministic commerce-link logic
        run: >-
          npx vitest run
          tests/official-commerce-links.spec.ts
          tests/official-commerce-refresh.spec.ts
          tests/business-info-source.spec.ts
          src/lib/loaders/businessInfo.spec.ts
      - name: Refresh links from official sites
        env:
          REFRESH_LIMIT: ${{ github.event.inputs.limit || '80' }}
          REFRESH_SLUG: ${{ github.event.inputs.slug }}
          REFRESH_FORCE: ${{ github.event.inputs.force }}
        run: |
          case "$REFRESH_LIMIT" in
            ''|*[!0-9]*)
              echo "::error title=Invalid refresh limit::The limit must be a positive whole number."
              exit 1
              ;;
          esac
          if [ "$REFRESH_LIMIT" -lt 1 ] || [ "$REFRESH_LIMIT" -gt 200 ]; then
            echo "::error title=Invalid refresh limit::The limit must be between 1 and 200."
            exit 1
          fi
          args=(--limit="$REFRESH_LIMIT" --concurrency=2)
          if [ -n "$REFRESH_SLUG" ]; then
            case "$REFRESH_SLUG" in
              *[!a-z0-9-]*)
                echo "::error title=Invalid place slug::Use only lowercase letters, numbers, and hyphens."
                exit 1
                ;;
            esac
            args+=(--slug="$REFRESH_SLUG")
          fi
          if [ "$REFRESH_FORCE" = "true" ]; then
            args+=(--force)
          fi
          npm run refresh:commerce-links -- "${args[@]}"
      - name: Rebuild public place artifacts
        run: npm run build:client-places
      - name: Promote reviewed place-page facts
        run: npm run data:release:write -- --stream places
      - name: Stage exact commerce-link output
        run: |
          set -euo pipefail
          install -D -m 0644 \
            src/data/business-info.json \
            "$RUNNER_TEMP/official-commerce-link-output/src/data/business-info.json"
          install -D -m 0644 \
            src/data/event-venue-photo-credits.json \
            "$RUNNER_TEMP/official-commerce-link-output/src/data/event-venue-photo-credits.json"
          install -D -m 0644 \
            src/data/places-client-hours.json \
            "$RUNNER_TEMP/official-commerce-link-output/src/data/places-client-hours.json"
          install -D -m 0644 \
            src/data/places-client.json \
            "$RUNNER_TEMP/official-commerce-link-output/src/data/places-client.json"
          install -D -m 0644 \
            src/data/data-release.json \
            "$RUNNER_TEMP/official-commerce-link-output/src/data/data-release.json"

      - name: Pin commerce artifact name to this generator attempt
        id: artifact-name
        env:
          ARTIFACT_NAME: official-commerce-link-output-${{ github.run_id }}-${{ github.run_attempt }}
        run: echo "name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload exact commerce-link output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: ${{ runner.temp }}/official-commerce-link-output
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: refresh
    permissions:
      actions: read
      contents: write
      pull-requests: write
    uses: ./.github/workflows/publish-automated-pr.yml
    with:
      artifact: ${{ needs.refresh.outputs.artifact_name }}
      base_sha: ${{ github.sha }}
      branch: bot/official-commerce-link-refresh
      allowed_paths: |
        src/data/business-info.json
        src/data/data-release.json
        src/data/event-venue-photo-credits.json
        src/data/places-client-hours.json
        src/data/places-client.json
      commit_message: "data: refresh official commerce links"
      title: "data: refresh official restaurant links"
      body: |
        Deterministic refresh of menu, ordering, reservation, catering, and
        gift-card links found as exact anchors on official business sites.

        No AI extraction, third-party directory crawl, menu-item scraping,
        price ingestion, or POS sync was used. Review the source URLs and
        direct actions before merging.

  checks:
    needs: publish
    if: ${{ needs.publish.outputs.pr_operation == 'created' || needs.publish.outputs.pr_operation == 'updated' }}
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/automated-pr-checks.yml
    with:
      branch: ${{ needs.publish.outputs.pr_branch }}
      head_sha: ${{ needs.publish.outputs.pr_head_sha }}
