name: Fair loopback surge gate

# This is intentionally manual. It exercises a production build on the NAS
# runner's own loopback interface and must never send synthetic traffic to a
# public, Vercel, LAN, Etix, or EventHub host.
on:
  workflow_dispatch: {}

concurrency:
  group: fair-loopback-surge
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  surge:
    if: ${{ github.repository == 'mikedlabs/frederick-radius' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, Linux, X64, radius-browser]
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the production app
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_OPTIONS: "--max-old-space-size=4096"

      - name: Run the bounded Fair surge gate on loopback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .perf
          server_pid=""
          cleanup() {
            set +e
            if [ -n "$server_pid" ] && kill -0 "$server_pid" 2>/dev/null; then
              kill -TERM "$server_pid" 2>/dev/null
              for _ in $(seq 1 20); do
                kill -0 "$server_pid" 2>/dev/null || break
                sleep 0.5
              done
              kill -KILL "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT INT TERM

          node node_modules/next/dist/bin/next start \
            --hostname 127.0.0.1 \
            --port 3000 \
            >.perf/fair-server.log 2>&1 &
          server_pid=$!

          ready=0
          for _ in $(seq 1 90); do
            if node -e "fetch('http://127.0.0.1:3000/moments/great-frederick-fair-2026', { redirect: 'manual' }).then((r) => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"; then
              ready=1
              break
            fi
            kill -0 "$server_pid"
            sleep 1
          done
          test "$ready" -eq 1

          npm run perf:fair:surge -- --target=http://127.0.0.1:3000
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Upload Fair surge evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fair-surge-${{ github.run_id }}
          path: |
            .perf/fair-surge
            .perf/fair-server.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
