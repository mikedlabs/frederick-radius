name: Attach automated PR checks

# Data publishers create review PRs with the repository token. GitHub holds
# their native pull_request workflows for approval, so the publisher dispatches
# the same secret-free CI and style workflows on the exact bot commit, then
# CI explicitly dispatches this bridge on main after its expensive verify job
# finishes. The bridge therefore polls only long enough for the parent CI run
# to settle, then copies real job conclusions to GitHub's synthetic PR merge
# commit, which is evaluated by the strict main-branch ruleset.
#
# No generated code is checked out or executed here. Before a status is
# written, the bot branch, head SHA, changed paths, current main revision, and
# open PR are all revalidated through the API.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Validated bot PR branch
        required: true
        type: string
      head_sha:
        description: Exact validated bot PR head
        required: true
        type: string
      dispatched_after:
        description: Earliest accepted CI/style dispatch time
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: write

jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validate the bot PR and attach its real job results
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AUTOMATED_PR_BRANCH: ${{ inputs.branch }}
          AUTOMATED_PR_HEAD_SHA: ${{ inputs.head_sha }}
          AUTOMATED_PR_DISPATCHED_AFTER: ${{ inputs.dispatched_after }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = process.env.AUTOMATED_PR_BRANCH;
            const headSha = process.env.AUTOMATED_PR_HEAD_SHA;
            const dispatchedAfter = Date.parse(process.env.AUTOMATED_PR_DISPATCHED_AFTER || '');

            if (context.ref !== 'refs/heads/main') {
              core.setFailed('The automated status bridge must run from main.');
              return;
            }
            if (!Number.isFinite(dispatchedAfter)) {
              core.setFailed('The check dispatcher did not provide a valid start time.');
              return;
            }
            const now = Date.now();
            if (dispatchedAfter > now + 60_000 || dispatchedAfter < now - 60 * 60_000) {
              core.setFailed('The check dispatch start time is outside the accepted window.');
              return;
            }

            const mainRef = await github.rest.git.getRef({ owner, repo, ref: 'heads/main' });
            const mainSha = mainRef.data.object.sha;

            const allowedByBranch = {
              'bot/marc-schedule-refresh': ['src/data/marc-schedule.json'],
              'bot/data-steward': [
                'docs/coverage-scorecard.md',
                'docs/hours-refresh-review.md',
                'src/data/data-release.json',
                'src/data/event-venue-photo-credits.json',
                'src/data/place-refresh-identities.json',
                'src/data/places-client-hours.json',
                'src/data/places-client.json',
                'src/data/places-hours-refresh.json',
              ],
              'bot/transit-steward': [
                'src/data/data-release.json',
                'src/data/transit-network.json',
                'src/data/transit-trips.json',
                'src/data/transit.json',
              ],
              'bot/curated-place-enrichment': [
                'src/data/data-release.json',
                'src/data/event-venue-photo-credits.json',
                'src/data/place-refresh-identities.json',
                'src/data/places-client-hours.json',
                'src/data/places-client.json',
                'src/data/places-enrichment.json',
              ],
              'bot/business-info-refresh': [
                'src/data/business-info.json',
                'src/data/data-release.json',
                'src/data/descriptions.json',
                'src/data/event-venue-photo-credits.json',
                'src/data/places-client-hours.json',
                'src/data/places-client.json',
              ],
              'bot/municipal-civic-refresh': ['src/data/municipal-civic.json'],
              'bot/venue-event-refresh': [
                'src/data/data-release.json',
                'src/data/venue-event-source-inventory.json',
                'src/data/venue-event-source-state.json',
                'src/data/venue-events.json',
              ],
              'bot/google-photo-attribution-backfill': [
                'docs/coverage-scorecard.md',
                'src/data/data-release.json',
                'src/data/event-venue-photo-credits.json',
                'src/data/place-refresh-identities.json',
                'src/data/places-client-hours.json',
                'src/data/places-client.json',
                'src/data/places-enrichment.json',
              ],
              'bot/official-commerce-link-refresh': [
                'src/data/business-info.json',
                'src/data/data-release.json',
                'src/data/event-venue-photo-credits.json',
                'src/data/places-client-hours.json',
                'src/data/places-client.json',
              ],
            };

            const allowlist = allowedByBranch[branch];
            if (!allowlist || !/^[0-9a-f]{40}$/.test(headSha || '')) {
              core.setFailed(`Refusing an unexpected automated branch or head: ${String(branch)}`);
              return;
            }
            const botRef = await github.rest.git.getRef({
              owner,
              repo,
              ref: `heads/${branch}`,
            });
            if (botRef.data.object.sha !== headSha) {
              core.setFailed('The bot branch moved before its check results could be attached.');
              return;
            }

            const pulls = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              base: 'main',
              head: `${owner}:${branch}`,
              per_page: 10,
            });
            if (pulls.data.length !== 1) {
              core.setFailed(`Expected one open PR for ${branch}; found ${pulls.data.length}.`);
              return;
            }
            const pull = pulls.data[0];
            if (pull.head.sha !== headSha || pull.head.repo?.full_name !== `${owner}/${repo}`) {
              core.setFailed('The workflow result no longer matches the open PR head.');
              return;
            }

            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              basehead: `${mainSha}...${headSha}`,
              per_page: 100,
            });
            if (comparison.data.behind_by !== 0) {
              core.setFailed(`The bot PR is behind main by ${comparison.data.behind_by} commit(s). Regenerate it.`);
              return;
            }
            const changed = (comparison.data.files || []).map((file) => file.filename);
            const unexpected = changed.filter((path) => !allowlist.includes(path));
            if (changed.length === 0 || unexpected.length > 0) {
              core.setFailed(`The bot PR changed files outside its allowlist: ${unexpected.join(', ') || 'no changed files'}`);
              return;
            }

            let mergeSha = null;
            for (let attempt = 0; attempt < 12; attempt += 1) {
              const current = await github.rest.pulls.get({ owner, repo, pull_number: pull.number });
              if (
                current.data.head.sha !== headSha ||
                current.data.base.ref !== 'main' ||
                current.data.base.sha !== mainSha
              ) {
                core.setFailed('The PR changed while its check results were being attached.');
                return;
              }
              if (/^[0-9a-f]{40}$/.test(current.data.merge_commit_sha || '')) {
                mergeSha = current.data.merge_commit_sha;
                break;
              }
              await new Promise((resolve) => setTimeout(resolve, 2000));
            }
            if (!mergeSha) {
              core.setFailed('GitHub did not produce a merge revision for the automated PR.');
              return;
            }

            const mergeCommit = await github.rest.git.getCommit({ owner, repo, commit_sha: mergeSha });
            const mergeParents = mergeCommit.data.parents.map((parent) => parent.sha);
            if (mergeParents[0] !== mainSha || mergeParents[1] !== headSha) {
              core.setFailed('The PR merge revision does not combine the validated main and bot commits.');
              return;
            }

            const workflowSpecs = [
              {
                workflowId: 'ci.yml',
                workflowName: 'CI',
                contexts: ['verify'],
              },
              {
                workflowId: 'style.yml',
                workflowName: 'style',
                contexts: ['style-lint'],
              },
            ];
            const allContexts = workflowSpecs.flatMap((spec) => spec.contexts);
            const writeAllStatuses = async (state, description, targetUrl = pull.html_url) => {
              for (const contextName of allContexts) {
                await github.rest.repos.createCommitStatus({
                  owner,
                  repo,
                  sha: mergeSha,
                  state,
                  context: contextName,
                  description,
                  target_url: targetUrl,
                });
              }
            };
            await writeAllStatuses('pending', 'Trusted automated-data checks are running');

            const acceptedAfter = dispatchedAfter - 5_000;
            const discoveryDeadline = Date.now() + 2 * 60_000;
            const completionDeadline = Date.now() + 5 * 60_000;
            const discoveredRuns = new Map();
            const completedRuns = new Map();
            while (completedRuns.size < workflowSpecs.length) {
              for (const spec of workflowSpecs) {
                const recentRuns = await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: spec.workflowId,
                  branch,
                  event: 'workflow_dispatch',
                  per_page: 100,
                });
                const candidate = recentRuns.data.workflow_runs.find((run) =>
                  run.head_sha === headSha &&
                  run.head_branch === branch &&
                  run.head_repository?.full_name === `${owner}/${repo}` &&
                  Date.parse(run.created_at || '') >= acceptedAfter
                );
                if (candidate) {
                  discoveredRuns.set(spec.workflowId, candidate);
                  if (candidate.status === 'completed') {
                    // A completed unsuccessful workflow cannot recover. Stop
                    // paying for this bridge runner while an unrelated gate
                    // finishes; the dispatched workflows keep their own logs.
                    if (candidate.conclusion !== 'success') {
                      const conclusion = candidate.conclusion || 'unknown';
                      await writeAllStatuses(
                        'error',
                        `${spec.workflowName} concluded: ${conclusion}`,
                        candidate.html_url,
                      );
                      core.setFailed(`${spec.workflowName} concluded before the other gates: ${conclusion}`);
                      return;
                    }
                    completedRuns.set(spec.workflowId, candidate);
                  }
                }
              }

              if (completedRuns.size === workflowSpecs.length) break;
              if (
                Date.now() >= discoveryDeadline &&
                discoveredRuns.size < workflowSpecs.length
              ) {
                const missing = workflowSpecs
                  .filter((spec) => !discoveredRuns.has(spec.workflowId))
                  .map((spec) => spec.workflowName);
                await writeAllStatuses('error', `Checks did not start: ${missing.join(', ')}`);
                core.setFailed(`Timed out waiting for dispatched checks to appear: ${missing.join(', ')}`);
                return;
              }
              if (Date.now() >= completionDeadline) {
                await writeAllStatuses('error', 'Trusted automated-data checks timed out');
                core.setFailed('Timed out waiting for dispatched checks to finish.');
                return;
              }
              await new Promise((resolve) => setTimeout(resolve, 10_000));
            }

            // Revalidate every mutable identity after observing the completed
            // runs so a branch, PR, or main movement cannot inherit an earlier
            // result.
            const [latestMain, latestBot, latestPull] = await Promise.all([
              github.rest.git.getRef({ owner, repo, ref: 'heads/main' }),
              github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` }),
              github.rest.pulls.get({ owner, repo, pull_number: pull.number }),
            ]);
            if (
              latestMain.data.object.sha !== mainSha ||
              latestBot.data.object.sha !== headSha ||
              latestPull.data.head.sha !== headSha ||
              latestPull.data.base.ref !== 'main' ||
              latestPull.data.base.sha !== mainSha ||
              latestPull.data.state !== 'open'
            ) {
              await writeAllStatuses('error', 'The PR changed while checks were running');
              core.setFailed('The PR, bot branch, or main changed while checks were running. Regenerate it.');
              return;
            }

            for (const spec of workflowSpecs) {
              const run = completedRuns.get(spec.workflowId);
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
                owner,
                repo,
                run_id: run.id,
                attempt_number: run.run_attempt,
                per_page: 100,
              });
              const missingJobs = spec.contexts.filter((contextName) => {
                const job = jobs.find((candidate) => candidate.name === contextName);
                return !job || !job.completed_at;
              });
              if (missingJobs.length > 0) {
                for (const contextName of spec.contexts) {
                  await github.rest.repos.createCommitStatus({
                    owner,
                    repo,
                    sha: mergeSha,
                    state: 'error',
                    context: contextName,
                    description: `${spec.workflowName} did not produce its required jobs`,
                    target_url: run.html_url,
                  });
                }
                core.setFailed(`${spec.workflowName} did not contain completed jobs: ${missingJobs.join(', ')}`);
                return;
              }

              for (const contextName of spec.contexts) {
                const job = jobs.find((candidate) => candidate.name === contextName);
                const state = job.conclusion === 'success'
                  ? 'success'
                  : job.conclusion === 'failure'
                    ? 'failure'
                    : 'error';
                await github.rest.repos.createCommitStatus({
                  owner,
                  repo,
                  sha: mergeSha,
                  state,
                  context: contextName,
                  description: state === 'success'
                    ? 'Passed in the trusted automated-data gate'
                    : `Automated-data gate concluded: ${job.conclusion || 'unknown'}`,
                  target_url: job.html_url,
                });
                core.info(`${contextName}: ${state} -> ${mergeSha}`);
              }
            }
