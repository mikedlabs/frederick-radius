name: freshness-check

# Daily verification catches sources that fetch successfully while quietly
# returning frozen payloads. Checking and issue mutation use separate tokens.

on:
  schedule:
    - cron: "0 11 * * *" # after the daily snapshot refresh
  workflow_dispatch: {}

permissions: {}

jobs:
  check:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      manifest_outcome: ${{ steps.manifest.outcome }}
      freshness_outcome: ${{ steps.fresh.outcome }}
    steps:
      - name: Checkout trusted freshness code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Checkout the latest snapshot manifest
        id: snapshot
        continue-on-error: true
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: data-snapshots
          path: .latest-snapshot
          fetch-depth: 1
          persist-credentials: false

      - name: Load the latest pipeline manifest
        id: manifest
        if: ${{ always() }}
        continue-on-error: true
        env:
          SNAPSHOT_OUTCOME: ${{ steps.snapshot.outcome }}
        run: |
          set -euo pipefail
          if [ "$SNAPSHOT_OUTCOME" != "success" ]; then
            echo "The data-snapshots branch could not be checked out." | tee manifest-load.log
            exit 1
          fi
          install -m 0600 .latest-snapshot/data/sources.yaml /tmp/frederick-radius-sources.yaml
          rm -rf .latest-snapshot
          echo "Loaded the latest pipeline source manifest." | tee manifest-load.log

      - name: Set up Node
        if: ${{ steps.manifest.outcome == 'success' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        if: ${{ steps.manifest.outcome == 'success' }}
        run: npm ci

      - name: Check freshness
        id: fresh
        if: ${{ steps.manifest.outcome == 'success' }}
        continue-on-error: true
        env:
          SOURCE_MANIFEST: /tmp/frederick-radius-sources.yaml
        run: |
          set -o pipefail
          npm run pipeline:freshness 2>&1 | tee freshness.log

      - name: Save freshness logs for the reporter
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: freshness-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            manifest-load.log
            freshness.log
          if-no-files-found: warn
          retention-days: 7

  report:
    needs: check
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Checkout trusted issue lifecycle code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download freshness logs
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: freshness-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: workflow-logs

      - name: Update the single freshness issue
        id: lifecycle
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          MANIFEST_OUTCOME: ${{ needs.check.outputs.manifest_outcome }}
          FRESHNESS_OUTCOME: ${{ needs.check.outputs.freshness_outcome }}
        with:
          script: |
            const fs = require('fs');
            const lifecycle = require('./scripts/lib/automated-data-issue.cjs');
            const manifestHealthy = process.env.MANIFEST_OUTCOME === 'success';
            const freshnessHealthy = process.env.FRESHNESS_OUTCOME === 'success';
            const healthy = manifestHealthy && freshnessHealthy;
            core.setOutput('healthy', healthy ? 'true' : 'false');
            if (healthy) {
              await lifecycle.closeRecovered({
                github,
                context,
                family: 'freshness',
                recoveryMessage: 'All pipeline-managed sources are within their declared snapshot and change cadence.',
              });
              return;
            }
            const selected = manifestHealthy ? 'freshness.log' : 'manifest-load.log';
            let log = '';
            try { log = fs.readFileSync(`workflow-logs/${selected}`, 'utf8').slice(-6000); } catch (error) {}
            const body = [
              manifestHealthy
                ? 'One or more pipeline-managed sources are outside their declared snapshot or change cadence.'
                : 'The freshness monitor could not load the latest validated pipeline manifest.',
              '',
              log ? 'Monitor output (tail):' : 'No monitor log was available.',
              ...(log ? ['```', log, '```'] : []),
              '',
              'Confirm the source response and its declared cadence before changing the policy.',
            ].join('\n');
            await lifecycle.upsertFailure({ github, context, family: 'freshness', body });

      - name: Fail the workflow when freshness is degraded
        if: ${{ steps.lifecycle.outputs.healthy != 'true' }}
        run: exit 1
