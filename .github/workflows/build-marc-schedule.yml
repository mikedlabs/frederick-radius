name: Build MARC schedule

# Rebuilds src/data/marc-schedule.json from the MTA MARC GTFS feed
# (public, keyless) and commits it if it changed. MARC's GTFS rotates on
# a seasonal service-change cycle, so the static snapshot silently drifts
# without this. The rebuild also repopulates feedDate from feed_info.txt
# (currently null), so staleness becomes detectable.

on:
  schedule:
    - cron: "0 8 1 * *" # 1st of each month, 08:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-marc-schedule
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Rebuild MARC schedule from GTFS
        run: npm run build:marc-schedule
      - name: Open review PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/marc-schedule-refresh
          base: ${{ github.ref_name }}
          commit-message: "data: refresh MARC schedule from GTFS (automated)"
          title: "data: refresh MARC schedule"
          body: |
            Automated MARC GTFS schedule refresh.

            Review the feed date and Brunswick Line service-window changes
            before merging.
          labels: |
            data-pipeline
            automated
          delete-branch: true
