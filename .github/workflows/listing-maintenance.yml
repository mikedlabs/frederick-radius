name: Daily listing maintenance

# One offline inventory of every reviewed public listing, after the morning
# collectors. This never fetches a merchant page or calls a paid provider.
# Collection, reviewed publication and the served deployment remain distinct.
on:
  schedule:
    - cron: "7 14 * * *"
  workflow_dispatch: {}

permissions: {}
concurrency:
  group: listing-maintenance
  cancel-in-progress: false

jobs:
  inventory:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
      report_outcome: ${{ steps.report.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reconcile all reviewed listing records
        id: report
        env:
          READ_MODEL_SHA: ${{ github.sha }}
        run: |
          npm run audit:listings -- --output-dir "$RUNNER_TEMP/listing-maintenance" --git-sha "$READ_MODEL_SHA"
          cat "$RUNNER_TEMP/listing-maintenance/listing-maintenance.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Pin report to this exact attempt
        id: artifact
        if: ${{ always() }}
        env:
          ARTIFACT_NAME: listing-maintenance-${{ github.run_id }}-${{ github.run_attempt }}
        run: echo "name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
      - name: Preserve the complete listing inventory
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ runner.temp }}/listing-maintenance
          if-no-files-found: warn
          retention-days: 30

  alert:
    needs: inventory
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/lib/automated-data-issue.cjs
            scripts/lib/listing-maintenance-alert.cjs
          sparse-checkout-cone-mode: false
      - name: Read only this run's bounded report
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.inventory.outputs.artifact_name }}
          path: listing-report
      - name: Maintain one exception issue
        id: outcome
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT_OUTCOME: ${{ needs.inventory.outputs.report_outcome }}
        with:
          script: |
            const fs = require('fs');
            const lifecycle = require('./scripts/lib/automated-data-issue.cjs');
            const { listingMaintenanceOutcome } = require('./scripts/lib/listing-maintenance-alert.cjs');
            let result;
            try {
              if (process.env.REPORT_OUTCOME !== 'success') throw new Error('Inventory generation failed.');
              const path = 'listing-report/listing-maintenance.json';
              const stat = fs.lstatSync(path);
              if (!stat.isFile() || stat.isSymbolicLink() || stat.size > 6291456) throw new Error('Invalid report boundary.');
              const report = JSON.parse(fs.readFileSync(path, 'utf8'));
              if (report.git_sha !== context.sha) throw new Error('Report revision does not match this trusted run.');
              result = listingMaintenanceOutcome(report);
            } catch {
              result = { healthy: false, fingerprint: require('node:crypto').createHash('sha256').update('listing-report-unverified-v1').digest('hex'), detail: 'The daily listing inventory could not be verified. Coverage is unknown, not zero or recovered. Inspect the inventory job and preserve the last reviewed source facts.' };
            }
            core.setOutput('healthy', String(result.healthy));
            if (result.healthy) {
              await lifecycle.closeRecovered({ github, context, family: 'listings', recoveryMessage: 'The full reviewed listing inventory reconciles, accepted official schedules are current and bundled photo files exist. Remaining unknown coverage is reported separately.' });
            } else {
              await lifecycle.upsertFailure({ github, context, family: 'listings', body: result.detail, fingerprint: result.fingerprint });
            }
      - name: Fail clearly when upkeep requires attention
        if: ${{ steps.outcome.outputs.healthy != 'true' }}
        run: exit 1
