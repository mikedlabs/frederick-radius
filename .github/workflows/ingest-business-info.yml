name: Ingest business deep-info

# Reads each food/drink place's own website (URLs already on file in
# places-enrichment.json) and extracts what Google misses — known-for,
# happy hours, specials, published hours — into src/data/business-info.json.
# Incremental + batched, so it works through the ~600 eligible businesses
# a chunk at a time and refreshes stale entries.
#
# Uses a standard Anthropic API key dedicated to this workflow in the GitHub
# Data Enrichment environment. Never use an Anthropic Admin API key here.
# Tuning: config/business-info.json

on:
  schedule:
    - cron: "0 8 * * *" # daily 08:00 UTC — a batch per day, refresh-aware
  workflow_dispatch:
    inputs:
      limit:
        description: "Businesses to read (normal max 60; reviewed backfill max 100)"
        required: false
        default: "60"
      reviewed_backfill:
        description: "I reviewed this backfill and approve a limit above 60"
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ingest-business-info
  cancel-in-progress: false

jobs:
  ingest:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    environment: "Data Enrichment"
    # Opt the JS actions into Node 24 now (GitHub forces it June 16 2026);
    # clears the Node-20 deprecation warning. Job-level env is valid YAML
    # (unlike the top-level block that broke parsing before).
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Verify extractor secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_BUSINESS_INFO_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error title=Missing business extractor key::Add ANTHROPIC_BUSINESS_INFO_API_KEY to the GitHub Data Enrichment environment."
            exit 1
          fi
      - run: npm ci
      - name: Verify business copy boundary before paid extraction
        run: npm test -- tests/business-info-copy.spec.ts tests/style-lint.spec.ts
      - name: Install Chromium (for the render fallback on JS-only sites)
        run: npx playwright install --with-deps chromium
      - name: Verify optional Firecrawl fallback
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          FIRECRAWL_FETCH_FALLBACK: ${{ vars.FIRECRAWL_FETCH_FALLBACK || '0' }}
          FIRECRAWL_FALLBACK_MAX_REQUESTS: ${{ vars.FIRECRAWL_FALLBACK_MAX_REQUESTS || '6' }}
        run: |
          case "$FIRECRAWL_FETCH_FALLBACK" in
            0) ;;
            1)
              if [ -z "$FIRECRAWL_API_KEY" ]; then
                echo "::error title=Missing FIRECRAWL_API_KEY::The Firecrawl fallback is enabled but the Data Enrichment environment has no key."
                exit 1
              fi
              ;;
            *)
              echo "::error title=Invalid Firecrawl setting::FIRECRAWL_FETCH_FALLBACK must be 0 or 1."
              exit 1
              ;;
          esac
          case "$FIRECRAWL_FALLBACK_MAX_REQUESTS" in
            ''|*[!0-9]*)
              echo "::error title=Invalid Firecrawl request cap::Use a whole number from 1 through 20."
              exit 1
              ;;
          esac
          if [ "$FIRECRAWL_FALLBACK_MAX_REQUESTS" -lt 1 ] || [ "$FIRECRAWL_FALLBACK_MAX_REQUESTS" -gt 20 ]; then
            echo "::error title=Invalid Firecrawl request cap::Use a whole number from 1 through 20."
            exit 1
          fi
      - name: Extract business deep-info
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_BUSINESS_INFO_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          FIRECRAWL_FETCH_FALLBACK: ${{ vars.FIRECRAWL_FETCH_FALLBACK || '0' }}
          FIRECRAWL_FALLBACK_MAX_REQUESTS: ${{ vars.FIRECRAWL_FALLBACK_MAX_REQUESTS || '6' }}
          INGEST_LIMIT: ${{ inputs.limit || '60' }}
          REVIEWED_BACKFILL: ${{ inputs.reviewed_backfill || 'false' }}
        run: |
          case "$INGEST_LIMIT" in
            ''|*[!0-9]*)
              echo "::error title=Invalid ingest limit::The limit must be a whole number."
              exit 1
              ;;
          esac
          if [ "$INGEST_LIMIT" -lt 1 ] || [ "$INGEST_LIMIT" -gt 100 ]; then
            echo "::error title=Invalid ingest limit::Use a value from 1 through 100."
            exit 1
          fi
          case "$REVIEWED_BACKFILL" in
            true|false) ;;
            *)
              echo "::error title=Invalid backfill confirmation::reviewed_backfill must be true or false."
              exit 1
              ;;
          esac
          if [ "$INGEST_LIMIT" -gt 60 ] && [ "$REVIEWED_BACKFILL" != "true" ]; then
            echo "::error title=Backfill review required::Normal runs are capped at 60. Check reviewed_backfill to approve a reviewed batch of up to 100."
            exit 1
          fi
          npm run ingest:business -- --limit="$INGEST_LIMIT"
      - name: Build description review queue
        run: npm run descriptions:candidates
      # Commits pushed with GITHUB_TOKEN do not start another workflow run.
      # business-info.json contains Radius-authored prose, so gate it here.
      - name: Verify Radius-authored copy
        run: npm run style:lint
      - name: Stage exact review files
        run: |
          set -euo pipefail
          install -D -m 0644 src/data/business-info.json "$RUNNER_TEMP/automated-pr-output/src/data/business-info.json"
          install -D -m 0644 src/data/descriptions.json "$RUNNER_TEMP/automated-pr-output/src/data/descriptions.json"

      - name: Upload isolated review artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: business-info-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/automated-pr-output
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: ingest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    uses: ./.github/workflows/publish-automated-pr.yml
    with:
      artifact: business-info-review-${{ github.run_id }}-${{ github.run_attempt }}
      base_sha: ${{ github.sha }}
      branch: bot/business-info-refresh
      allowed_paths: |
        src/data/business-info.json
        src/data/descriptions.json
      commit_message: "data: refresh business deep-info (automated)"
      title: "data: refresh business information"
      body: |
        Automated business website extraction refresh.

        The workflow ran the Radius copy checks before opening this PR.
        Review source links, hours or specials, and generated description
        candidates before merging.

  checks:
    needs: publish
    if: ${{ needs.publish.outputs.pr_operation == 'created' || needs.publish.outputs.pr_operation == 'updated' }}
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/automated-pr-checks.yml
    with:
      branch: ${{ needs.publish.outputs.pr_branch }}
      head_sha: ${{ needs.publish.outputs.pr_head_sha }}
