name: Discovery dry run

# Weekly place-discovery dry run. The `discover` script spends $0 by
# default: it builds the full query plan (discoverable taxonomy ×
# municipalities) and prints the candidate count + a real dollar
# projection, but never calls the paid API and never merges places.
# Run it when an editor is ready to review the plan. The dry run itself costs
# no provider money, but a hosted runner and a recurring report without a
# pending editorial decision are still avoidable operating noise.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: discovery-dry-run-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Dry run only ($0, no API key needed). Capture output so the
      # candidate counts land in the job summary and an artifact.
      - name: Discovery dry run
        run: |
          set -o pipefail
          npm run discover 2>&1 | tee discovery-plan.log

      - name: Publish plan to job summary
        if: always()
        run: |
          {
            echo '## Discovery dry run'
            echo '```'
            cat discovery-plan.log || echo "(no output)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload discovery plan
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: discovery-plan
          path: discovery-plan.log
          if-no-files-found: ignore
          retention-days: 14
