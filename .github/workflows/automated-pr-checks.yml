name: Automated PR checks

# Start only the existing held native pull_request CI/style runs after the
# protected-main helper validates the exact PR and current data-only surface.
# No repository checkout, generated code execution, workflow dispatch, check
# copying, fact acceptance or additional auto-merge authority lives here.
on:
  workflow_call:
    inputs:
      branch:
        description: Bot pull-request branch requiring native gates
        required: true
        type: string
      head_sha:
        description: Exact PR head created by the isolated publisher
        required: true
        type: string

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Approve only exact eligible held native PR gates
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AUTOMATED_PR_BRANCH: ${{ inputs.branch }}
          AUTOMATED_PR_HEAD_SHA: ${{ inputs.head_sha }}
          NATIVE_PR_RECEIPT_PATH: ${{ runner.temp }}/native-pr-approval.json
        with:
          script: |
            let receipt = { schema_version: 1, state: 'held', verified: false, phase: 'bootstrap',
              approvalWrites: 0, manualApprovalRequired: true };
            try {
              if (context.ref !== 'refs/heads/main') throw new Error('Native PR approval must run from main.');
              const main = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
              const trustedMainSha = main.data.object.sha;
              if (!/^[0-9a-f]{40}$/.test(trustedMainSha || '') || context.sha !== trustedMainSha) {
                throw new Error('Native PR approval requires the current protected main revision.');
              }
              const helperPath = 'scripts/lib/native-automated-pr-gates.cjs';
              const response = await github.rest.repos.getContent({ ...context.repo, path: helperPath, ref: trustedMainSha });
              const file = response.data;
              if (file.type !== 'file' || file.path !== helperPath || file.encoding !== 'base64'
                || !Number.isSafeInteger(file.size) || file.size <= 0 || file.size > 65536) {
                throw new Error('Invalid bounded protected-main native gate helper.');
              }
              const source = Buffer.from(file.content, 'base64');
              if (source.length !== file.size) throw new Error('Native gate helper size mismatch.');
              const trusted = { exports: {} };
              new Function('module', 'exports', source.toString('utf8'))(trusted, trusted.exports);
              receipt = await trusted.exports.approveNativeAutomatedPrRuns({
                github, context, trustedMainSha,
                branch: process.env.AUTOMATED_PR_BRANCH,
                headSha: process.env.AUTOMATED_PR_HEAD_SHA,
              });
              if (receipt.verified !== true || !['approved', 'observed'].includes(receipt.state)) {
                core.setFailed('Native PR gates remain held. Review the exact run IDs in the receipt; an owner may need to approve them in GitHub. No alternate gate was dispatched.');
              }
            } catch (error) {
              receipt = { ...receipt, verified: false, state: 'held', failure: error.message, manualApprovalRequired: true };
              core.setFailed('Native PR approval unavailable. Review the saved receipt and approve the exact native runs manually if eligible.');
            } finally {
              require('fs').writeFileSync(process.env.NATIVE_PR_RECEIPT_PATH,
                JSON.stringify(receipt, null, 2) + '\n', { mode: 0o600 });
              core.info(JSON.stringify(receipt));
              await core.summary.addHeading('Native PR gate execution approval')
                .addCodeBlock(JSON.stringify(receipt), 'json').write();
            }
      - name: Preserve native PR execution approval receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-pr-approval-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-pr-approval.json
          if-no-files-found: error
          retention-days: 14
