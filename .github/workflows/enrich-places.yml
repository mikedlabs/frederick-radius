name: Enrich places (Google)

# Monthly refresh of the CURATED editorial places against Google Places
# → src/data/places-enrichment.json. Cost-bounded by design: the script
# defaults to curated-only (~51 places, ~$2), only writes with
# --live --confirm, and honors a --max-cost hard cap. Skips cleanly (no
# red run) when GOOGLE_PLACES_API_KEY is unset, so it stays quiet until
# the key exists. DFP's long tail is enriched on demand elsewhere.

on:
  schedule:
    - cron: "0 6 1 * *" # 1st of each month, 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: enrich-curated-places
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Enrich curated places (cost-capped)
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          if [ -z "$GOOGLE_PLACES_API_KEY" ]; then
            echo "GOOGLE_PLACES_API_KEY not set — skipping enrichment."
            exit 0
          fi
          npm run enrich -- --live --confirm --max-cost 10
      - name: Rebuild public place snapshot
        run: npm run build:client-places

      - name: Enforce critical data gates
        run: npm run gates

      - name: Report high-severity data debt
        continue-on-error: true
        run: npm run gates -- --fail-high

      - name: Open review PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/curated-place-enrichment
          base: ${{ github.ref_name }}
          commit-message: "data: refresh Google enrichment for curated places (automated)"
          title: "data: refresh curated place enrichment"
          body: |
            Cost-capped monthly Google enrichment refresh for curated places.

            The workflow rebuilt the public place snapshot and enforced
            critical data gates. High-severity coverage debt is reported in the
            workflow without blocking an incremental review PR. Review closures,
            hours, contact details, and photo attribution before merging.
          labels: |
            data-pipeline
            automated
          delete-branch: true
