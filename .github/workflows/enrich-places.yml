name: Enrich places (Google)

# Monthly refresh of the CURATED editorial places against Google Places
# → src/data/places-enrichment.json. Cost-bounded by design: the script
# defaults to curated-only (~51 places, ~$2), only writes with
# --live --confirm, and honors a --max-cost hard cap. Skips cleanly (no
# red run) when GOOGLE_PLACES_API_KEY is unset, so it stays quiet until
# the key exists. DFP's long tail is enriched on demand elsewhere.

on:
  schedule:
    - cron: "0 6 1 * *" # 1st of each month, 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Enrich curated places (cost-capped)
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          if [ -z "$GOOGLE_PLACES_API_KEY" ]; then
            echo "GOOGLE_PLACES_API_KEY not set — skipping enrichment."
            exit 0
          fi
          npm run enrich -- --live --confirm --max-cost 10
      - name: Commit if changed
        run: |
          git config user.name "frederick-radius-bot"
          git config user.email "bot@users.noreply.github.com"
          if ! git diff --quiet -- src/data/places-enrichment.json; then
            git add src/data/places-enrichment.json
            git commit -m "data: refresh Google enrichment for curated places (automated)"
            git pull --rebase origin "${GITHUB_REF_NAME:-main}" || true
            git push origin "HEAD:${GITHUB_REF_NAME:-main}"
          else
            echo "No enrichment changes."
          fi
