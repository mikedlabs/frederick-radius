name: Visual contract candidates

# Visual references are captured on one known Linux/Chromium host before they
# become a blocking comparison. This workflow is manual so it adds no routine
# Actions cost and cannot make pull requests flaky while the first references
# are being reviewed.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Capture candidates, or compare after Linux baselines are committed
        required: true
        default: capture
        type: choice
        options:
          - capture
          - compare

permissions:
  contents: read

concurrency:
  group: visual-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    name: Provider-free Chromium (10 cases; styled map excluded)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium

      - name: Run 10 provider-free cases (working styled map excluded)
        id: visual-contract
        run: >-
          npm run test:visual:${{ inputs.mode }} --
          --grep-invert 'the map chooser preserves the map while revealing one command layer$'
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Record provider-free scope and renderer exclusion
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Provider-free visual contracts
          Mode: ${{ inputs.mode }}. Test step outcome: ${{ steps.visual-contract.outcome }}.

          This run covers 10 cases: Find, Ask empty/working, the bus sheet, and Compass at two viewports.
          The working styled-map chooser reference is excluded. This is not a full visual-suite pass or proof of a loaded map, rendered marks, or map attribution.
          Styled-map references require a separate approved renderer-enabled run with actual loaded-map and rendered-marks proof. See docs/VISUAL_CONTRACT.md.
          SUMMARY

      - name: Upload review images and pixel diffs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-contract-${{ inputs.mode }}-${{ github.run_id }}
          path: |
            visual-contract-candidates/*.png
            test-results/**/*-actual.png
            test-results/**/*-diff.png
            test-results/**/*-expected.png
          if-no-files-found: warn
          retention-days: 7
