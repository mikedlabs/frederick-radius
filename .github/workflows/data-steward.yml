name: data-steward

# Nightly data steward. Probes the critical feeds (informational), then
# runs the committed-artifact refresh scripts that keep the app's local
# data fresh: business status, rolling hours, transit GTFS, and park amenities. Each
# Hours and business-status failures are release-significant and fail loudly.
# Lower-risk transit and park rebuilds remain fail-soft. If anything changed on
# disk, the workflow opens a PR (PR-gated, never a direct push to a content
# branch) so a human reviews the data diff.

on:
  schedule:
    # 09:00 UTC nightly (~4-5 AM Eastern). The time is load-bearing, not
    # cosmetic: "Pull rolling hours snapshot" below reads the rows that the
    # Vercel cron /api/cron/hours-refresh WRITES at 08:00 UTC. This job used
    # to run at 06:00, two hours BEFORE the writer, so every night it pulled
    # a table the writer had not touched yet and the hours never reached the
    # app. Keep this after 08:00, and before the 09:30 data-health cron that
    # grades the result. If you move the writer in vercel.json, move this too.
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: data-steward
  cancel-in-progress: false

jobs:
  steward:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Informational only — the dedicated feed-health.yml job is what
      # turns a feed outage red. Here we just log it alongside the refresh.
      - name: Feed health (informational)
        run: tsx scripts/feed-health.ts || true

      # Core place freshness cannot silently no-op. A missing secret, database
      # failure, or failed paid refresh turns the workflow red.
      - name: Refresh business status
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: npm run refresh:business-status

      # Materialize the server cron's place_hours_refresh table into the
      # committed snapshot. The PR remains the human approval/deploy boundary.
      - name: Pull rolling hours snapshot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run refresh:hours

      # These secondary sources remain fail-soft so a temporary government
      # endpoint outage does not hide a successful place-data refresh.
      - name: Rebuild transit GTFS
        run: npm run build:transit || true

      - name: Rebuild park amenities
        run: npm run build:park-amenities || true

      # Rebuild the exact public snapshot and enforce critical safety gates.
      # High-severity coverage debt is reported separately below: it must stay
      # visible, but it cannot prevent an incremental refresh PR from opening.
      - name: Rebuild public place snapshot
        run: npm run build:client-places

      - name: Enforce critical data gates
        run: npm run gates

      - name: Report high-severity data debt
        continue-on-error: true
        run: npm run gates -- --fail-high

      # On any change, open (or update) a PR so a human reviews the data
      # diff before it merges. Never pushes straight to a content branch.
      - name: Open PR on changes
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/data-steward
          base: ${{ github.ref_name }}
          commit-message: "data: nightly steward refresh (automated)"
          title: "data: nightly steward refresh"
          body: |
            Automated nightly refresh from the data-steward workflow.

            Ran: refresh:business-status, refresh:hours, build:transit, build:park-amenities,
            build:client-places, and the data-quality scorecard. Critical gates
            block this PR; existing high-severity coverage debt remains visible
            without blocking an incremental refresh. Review the diff before merging.
          labels: |
            data-pipeline
            automated
          delete-branch: true
