name: data-steward

# Nightly data steward. Probes the critical feeds (informational), then
# runs the committed-artifact refresh scripts that keep the app's local
# data fresh: business status, rolling hours, transit GTFS, and park amenities.
# Hours, business-status, and transit failures are release-significant and fail
# loudly. Transit runs independently so a missing paid-place secret cannot stop
# its public-feed refresh. If anything changed on disk, the workflow opens a PR
# (PR-gated, never a direct push) so a human reviews the data diff.

on:
  schedule:
    # 09:00 UTC nightly (~4-5 AM Eastern). The time is load-bearing, not
    # cosmetic: "Pull rolling hours snapshot" below reads the rows that the
    # Vercel cron /api/cron/hours-refresh WRITES at 08:00 UTC. This job used
    # to run at 06:00, two hours BEFORE the writer, so every night it pulled
    # a table the writer had not touched yet and the hours never reached the
    # app. Keep this after 08:00, and before the 09:30 data-health cron that
    # grades the result. If you move the writer in vercel.json, move this too.
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: data-steward
  cancel-in-progress: false

jobs:
  steward:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Name missing prerequisites before the refresh scripts fail. Secret and
      # variable values are never printed. `continue-on-error` preserves the
      # independent step diagnostics below; the final enforcement step still
      # turns the job red.
      - name: Check business-status configuration
        id: business-config
        continue-on-error: true
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          if [ -z "$GOOGLE_PLACES_API_KEY" ]; then
            echo "::error title=Business-status refresh is not configured::Add the GOOGLE_PLACES_API_KEY GitHub Actions repository secret."
            exit 1
          fi
          echo "The Google Places key required by the business-status refresh is present."

      - name: Check hours snapshot configuration
        id: hours-config
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          missing=()
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            missing+=("NEXT_PUBLIC_SUPABASE_URL")
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]; then
            missing+=("NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            joined=$(IFS=", "; echo "${missing[*]}")
            echo "::error title=Hours snapshot is not configured::Add these browser-safe GitHub repository variables: $joined"
            exit 1
          fi
          echo "The hours snapshot will use Supabase's read-only anon Data API path."

      # Informational only — the dedicated feed-health.yml job is what
      # turns a feed outage red. Here we just log it alongside the refresh.
      - name: Feed health (informational)
        run: npm run feed:health || true

      # Core place freshness cannot silently no-op. A missing secret, database
      # failure, or failed paid refresh turns the workflow red. Let this step
      # finish independently so it cannot hide a separate hours-snapshot
      # prerequisite; the final enforcement step still fails the job.
      - name: Refresh business status
        id: business-status
        continue-on-error: true
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: npm run refresh:business-status

      # Materialize the server cron's place_hours_refresh table into the
      # committed snapshot. It runs even when business status fails so a
      # missing Google Actions secret does not mask missing read-only Data API
      # configuration, an empty server table, or an otherwise healthy refresh.
      - name: Pull rolling hours snapshot
        id: hours-snapshot
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run refresh:hours

      # Park data remains fail-soft so a temporary government endpoint outage
      # does not hide a successful place-data refresh. Transit has its own job
      # below so missing paid-place secrets cannot prevent its refresh.
      - name: Rebuild park amenities
        run: npm run build:park-amenities || true

      # Rebuild the exact public snapshot and enforce critical safety gates.
      # High-severity coverage debt is reported separately below: it must stay
      # visible, but it cannot prevent an incremental refresh PR from opening.
      - name: Rebuild public place snapshot
        run: npm run build:client-places

      - name: Enforce critical data gates
        run: npm run gates

      - name: Report high-severity data debt
        continue-on-error: true
        run: npm run gates -- --fail-high

      # On any change, open (or update) a PR so a human reviews the data
      # diff before it merges. Never pushes straight to a content branch.
      - name: Open PR on changes
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/data-steward
          base: ${{ github.ref_name }}
          commit-message: "data: nightly steward refresh (automated)"
          title: "data: nightly steward refresh"
          body: |
            Automated nightly refresh from the data-steward workflow.

            Ran: refresh:business-status, refresh:hours, build:park-amenities,
            build:client-places, and the data-quality scorecard. Transit refresh
            runs in its own independent job. Critical gates block this PR;
            existing high-severity coverage debt remains visible without
            blocking an incremental refresh. Review the diff before merging.
          labels: |
            data-pipeline
            automated
          delete-branch: true

      - name: Write core refresh summary
        if: ${{ always() }}
        run: |
          {
            echo "## Core place refresh"
            echo ""
            echo "| Check | Outcome |"
            echo "| --- | --- |"
            echo "| Business-status configuration | ${{ steps.business-config.outcome }} |"
            echo "| Hours snapshot configuration | ${{ steps.hours-config.outcome }} |"
            echo "| Business status refresh | ${{ steps.business-status.outcome }} |"
            echo "| Hours snapshot pull | ${{ steps.hours-snapshot.outcome }} |"
            echo ""
            echo "The GitHub hours pull should use browser-safe \`NEXT_PUBLIC_SUPABASE_URL\` and \`NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY\` repository variables, not a privileged database secret."
            echo "A healthy writer still requires Vercel Production to have \`HOURS_REFRESH_CRON=1\`, \`GOOGLE_PLACES_API_KEY\`, \`DATABASE_URL\`, and \`CRON_SECRET\`."
            echo "Apply \`drizzle/0024_place_hours_refresh.sql\` and \`drizzle/0034_expose_place_hours_refresh_read_only.sql\` in Supabase before enabling the paid Vercel cron and public pull."
            echo "Repository Settings → Actions → General must allow GitHub Actions to create pull requests."
          } >> "$GITHUB_STEP_SUMMARY"

      # `continue-on-error` above is diagnostic sequencing, not a relaxed
      # release policy. Fail after the independent work and PR handoff so the
      # Actions summary names every missing prerequisite in one run.
      - name: Enforce core place refresh results
        if: ${{ always() && (steps.business-config.outcome != 'success' || steps.hours-config.outcome != 'success' || steps.business-status.outcome != 'success' || steps.hours-snapshot.outcome != 'success') }}
        run: |
          echo "Business-status configuration: ${{ steps.business-config.outcome }}"
          echo "Hours snapshot configuration: ${{ steps.hours-config.outcome }}"
          echo "Business status refresh: ${{ steps.business-status.outcome }}"
          echo "Hours snapshot pull: ${{ steps.hours-snapshot.outcome }}"
          echo "Both core place refreshes must succeed. Check the named step logs and repository configuration."
          exit 1

  # Transit uses public feeds and must refresh independently of paid Google
  # data or database secrets. A failure in the place-data job can no longer
  # stop the rolling GTFS snapshot from reaching a reviewable PR.
  transit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild transit GTFS
        run: npm run build:transit

      - name: Validate transit snapshot
        run: npm test -- tests/transit-static-snapshot.spec.ts

      - name: Open transit PR on changes
        uses: peter-evans/create-pull-request@v6
        with:
          branch: bot/transit-steward
          base: ${{ github.ref_name }}
          commit-message: "data: refresh Frederick TransIT GTFS"
          title: "data: refresh Frederick TransIT GTFS"
          body: |
            Automated refresh from Frederick County TransIT's public Passio
            static GTFS feed. The committed snapshot freshness and network
            consistency tests passed. Review the diff before merging.
          labels: |
            data-pipeline
            automated
          delete-branch: true
