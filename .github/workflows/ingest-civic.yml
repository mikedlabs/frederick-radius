name: Ingest municipal civic data
run-name: Ingest municipal civic data (firecrawl=${{ vars.CIVIC_FIRECRAWL_FETCH_FALLBACK || '0' }}, cap=${{ vars.CIVIC_FIRECRAWL_FALLBACK_MAX_REQUESTS || '1' }})

# Closes the town parity gap: runs the Claude extraction agent against
# each town's configured gov page(s), refreshes src/data/municipal-civic.json
# with source + freshness, and commits the result. Daily + manual.
#
# Uses a standard Anthropic API key dedicated to this workflow in the GitHub
# Data Enrichment environment. Never use an Anthropic Admin API key here.
# Configure which pages to read in: config/municipal-civic-sources.json

on:
  schedule:
    - cron: "30 8 * * *" # daily 08:30 UTC, after business extraction
  workflow_dispatch:
    inputs:
      refresh_open_review:
        description: "I want to replace the currently open civic-data review with a fresh paid run"
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ vars.CIVIC_FIRECRAWL_FETCH_FALLBACK == '1' && 'operator-firecrawl-fallback-budget' || 'ingest-municipal-civic' }}
  cancel-in-progress: false

jobs:
  review-gate:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      should_run: ${{ steps.review.outputs.should_run }}
    steps:
      - name: Pause paid extraction while its review is open
        id: review
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REFRESH_OPEN_REVIEW: ${{ inputs.refresh_open_review || 'false' }}
        with:
          script: |
            const branch = 'bot/municipal-civic-refresh';
            const override = process.env.REFRESH_OPEN_REVIEW === 'true';
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'main',
              per_page: 100,
            });
            const review = pulls.find((pull) =>
              pull.head?.ref === branch &&
              pull.head?.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`
            );

            if (review && !override) {
              core.notice(`Skipping paid extraction while review PR #${review.number} is open: ${review.html_url}`);
              core.summary
                .addHeading('Civic extraction paused')
                .addRaw(`Review PR [#${review.number}](${review.html_url}) before spending on another run.\n`)
                .addRaw('Use the manual refresh_open_review override only when replacing that review is intentional.\n');
              await core.summary.write();
              core.setOutput('should_run', 'false');
              return;
            }

            if (review && override) {
              core.notice(`Manual override accepted; paid extraction may update review PR #${review.number}.`);
            }
            core.setOutput('should_run', 'true');

  ingest:
    needs: review-gate
    if: ${{ needs.review-gate.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    environment: "Data Enrichment"
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    outputs:
      artifact_name: ${{ steps.artifact-name.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify extractor secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_CIVIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error title=Missing civic extractor key::Add ANTHROPIC_CIVIC_API_KEY to the GitHub Data Enrichment environment."
            exit 1
          fi
      - run: npm ci
      - name: Validate optional Firecrawl fallback
        env:
          FIRECRAWL_FETCH_FALLBACK: ${{ vars.CIVIC_FIRECRAWL_FETCH_FALLBACK || '0' }}
          FIRECRAWL_FALLBACK_MAX_REQUESTS: ${{ vars.CIVIC_FIRECRAWL_FALLBACK_MAX_REQUESTS || '1' }}
        run: |
          case "$FIRECRAWL_FETCH_FALLBACK" in
            0) ;;
            1) ;;
            *)
              echo "::error title=Invalid Firecrawl setting::FIRECRAWL_FETCH_FALLBACK must be 0 or 1."
              exit 1
              ;;
          esac
          case "$FIRECRAWL_FALLBACK_MAX_REQUESTS" in
            ''|*[!0-9]*)
              echo "::error title=Invalid Firecrawl request cap::Use 1 or 2."
              exit 1
              ;;
          esac
          if [ "$FIRECRAWL_FALLBACK_MAX_REQUESTS" -lt 1 ] || [ "$FIRECRAWL_FALLBACK_MAX_REQUESTS" -gt 2 ]; then
            echo "::error title=Invalid Firecrawl request cap::Use 1 or 2."
            exit 1
          fi
      - name: Enforce shared Firecrawl fallback budget
        id: firecrawl-budget
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CURRENT_WORKFLOW_FILE: ingest-civic.yml
          FIRECRAWL_FETCH_FALLBACK: ${{ vars.CIVIC_FIRECRAWL_FETCH_FALLBACK || '0' }}
          FIRECRAWL_FALLBACK_MAX_REQUESTS: ${{ vars.CIVIC_FIRECRAWL_FALLBACK_MAX_REQUESTS || '1' }}
          FIRECRAWL_LEGACY_DISABLED_RUN_IDS: ${{ vars.FIRECRAWL_LEGACY_DISABLED_RUN_IDS || '' }}
        with:
          script: |
            const { enforceFirecrawlFallbackBudget } = require("./scripts/lib/firecrawl-fallback-budget.cjs");
            await enforceFirecrawlFallbackBudget({ github, context, core });
      - name: Verify enabled Firecrawl fallback secret
        if: ${{ success() && steps.firecrawl-budget.outputs.allowed == 'true' && steps.firecrawl-budget.outputs.enabled == 'true' }}
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          if [ -z "$FIRECRAWL_API_KEY" ]; then
            echo "::error title=Missing FIRECRAWL_API_KEY::The Firecrawl fallback passed its shared budget gate, but the Data Enrichment environment has no key."
            exit 1
          fi
      - name: Extract civic data
        if: ${{ success() && steps.firecrawl-budget.outputs.allowed == 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_CIVIC_API_KEY }}
          FIRECRAWL_API_KEY: ${{ steps.firecrawl-budget.outputs.allowed == 'true' && steps.firecrawl-budget.outputs.enabled == 'true' && secrets.FIRECRAWL_API_KEY || '' }}
          FIRECRAWL_FETCH_FALLBACK: ${{ vars.CIVIC_FIRECRAWL_FETCH_FALLBACK || '0' }}
          FIRECRAWL_FALLBACK_MAX_REQUESTS: ${{ vars.CIVIC_FIRECRAWL_FALLBACK_MAX_REQUESTS || '1' }}
        run: npm run ingest:civic

      - name: Stage exact review files
        run: |
          set -euo pipefail
          install -D -m 0644 src/data/municipal-civic.json "$RUNNER_TEMP/automated-pr-output/src/data/municipal-civic.json"

      - name: Pin review artifact name to this generator attempt
        id: artifact-name
        env:
          ARTIFACT_NAME: municipal-civic-review-${{ github.run_id }}-${{ github.run_attempt }}
        run: echo "name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload isolated review artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: ${{ runner.temp }}/automated-pr-output
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: ingest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    uses: ./.github/workflows/publish-automated-pr.yml
    with:
      artifact: ${{ needs.ingest.outputs.artifact_name }}
      base_sha: ${{ github.sha }}
      branch: bot/municipal-civic-refresh
      allowed_paths: src/data/municipal-civic.json
      commit_message: "data: refresh municipal civic (automated)"
      title: "data: refresh municipal civic information"
      body: |
        Automated municipal-source extraction refresh.

        Review source links, effective dates, and any changed instructions
        before merging. CI runs on this PR before the data can reach users.

  checks:
    needs: publish
    if: ${{ needs.publish.outputs.pr_operation == 'created' || needs.publish.outputs.pr_operation == 'updated' }}
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/automated-pr-checks.yml
    with:
      branch: ${{ needs.publish.outputs.pr_branch }}
      head_sha: ${{ needs.publish.outputs.pr_head_sha }}
