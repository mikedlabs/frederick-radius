name: Ingest municipal civic data

# Closes the town parity gap: runs the Claude extraction agent against
# each town's configured gov page(s), refreshes src/data/municipal-civic.json
# with source + freshness, and commits the result. Daily + manual.
#
# Uses a standard Anthropic API key dedicated to this workflow in the GitHub
# Data Enrichment environment. Never use an Anthropic Admin API key here.
# Configure which pages to read in: config/municipal-civic-sources.json

on:
  schedule:
    - cron: "30 8 * * *" # daily 08:30 UTC, after business extraction
  workflow_dispatch: {} # run on demand from the Actions tab

permissions: {}

concurrency:
  group: ingest-municipal-civic
  cancel-in-progress: false

jobs:
  ingest:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    environment: "Data Enrichment"
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify extractor secret
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_CIVIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error title=Missing civic extractor key::Add ANTHROPIC_CIVIC_API_KEY to the GitHub Data Enrichment environment."
            exit 1
          fi
      - run: npm ci
      - name: Verify optional Firecrawl fallback
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          FIRECRAWL_FETCH_FALLBACK: ${{ vars.FIRECRAWL_FETCH_FALLBACK || '0' }}
          FIRECRAWL_FALLBACK_MAX_REQUESTS: ${{ vars.FIRECRAWL_FALLBACK_MAX_REQUESTS || '6' }}
        run: |
          case "$FIRECRAWL_FETCH_FALLBACK" in
            0) ;;
            1)
              if [ -z "$FIRECRAWL_API_KEY" ]; then
                echo "::error title=Missing FIRECRAWL_API_KEY::The Firecrawl fallback is enabled but the Data Enrichment environment has no key."
                exit 1
              fi
              ;;
            *)
              echo "::error title=Invalid Firecrawl setting::FIRECRAWL_FETCH_FALLBACK must be 0 or 1."
              exit 1
              ;;
          esac
          case "$FIRECRAWL_FALLBACK_MAX_REQUESTS" in
            ''|*[!0-9]*)
              echo "::error title=Invalid Firecrawl request cap::Use a whole number from 1 through 20."
              exit 1
              ;;
          esac
          if [ "$FIRECRAWL_FALLBACK_MAX_REQUESTS" -lt 1 ] || [ "$FIRECRAWL_FALLBACK_MAX_REQUESTS" -gt 20 ]; then
            echo "::error title=Invalid Firecrawl request cap::Use a whole number from 1 through 20."
            exit 1
          fi
      - name: Extract civic data
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_CIVIC_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          FIRECRAWL_FETCH_FALLBACK: ${{ vars.FIRECRAWL_FETCH_FALLBACK || '0' }}
          FIRECRAWL_FALLBACK_MAX_REQUESTS: ${{ vars.FIRECRAWL_FALLBACK_MAX_REQUESTS || '6' }}
        run: npm run ingest:civic

      - name: Stage exact review files
        run: |
          set -euo pipefail
          install -D -m 0644 src/data/municipal-civic.json "$RUNNER_TEMP/automated-pr-output/src/data/municipal-civic.json"

      - name: Upload isolated review artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: municipal-civic-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/automated-pr-output
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: ingest
    permissions:
      actions: read
      contents: write
      pull-requests: write
    uses: ./.github/workflows/publish-automated-pr.yml
    with:
      artifact: municipal-civic-review-${{ github.run_id }}-${{ github.run_attempt }}
      base_sha: ${{ github.sha }}
      branch: bot/municipal-civic-refresh
      allowed_paths: src/data/municipal-civic.json
      commit_message: "data: refresh municipal civic (automated)"
      title: "data: refresh municipal civic information"
      body: |
        Automated municipal-source extraction refresh.

        Review source links, effective dates, and any changed instructions
        before merging. CI runs on this PR before the data can reach users.

  checks:
    needs: publish
    if: ${{ needs.publish.outputs.pr_operation == 'created' || needs.publish.outputs.pr_operation == 'updated' }}
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/automated-pr-checks.yml
    with:
      branch: ${{ needs.publish.outputs.pr_branch }}
      head_sha: ${{ needs.publish.outputs.pr_head_sha }}
