name: Ingest venue events

# Captures lineups from venues that only post on their own site
# (The Banyan, Sky Stage, Bandsintown-backed venues). Runs the venue
# extraction agent, refreshes src/data/venue-events.json, commits.
# Requires repo secret: ANTHROPIC_API_KEY. Configure: config/venue-sources.json

on:
  schedule:
    - cron: "30 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Extract venue events
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run ingest:venues
      # Commits pushed with GITHUB_TOKEN do not start another workflow run.
      # Run the copy/provenance gates here before the bot writes to main.
      - name: Verify venue copy provenance and voice
        run: |
          npm run style:lint
          npx vitest run tests/venue-events-copy.spec.ts tests/squarespace-events.spec.ts
      - name: Commit refreshed data
        run: |
          git config user.name "frederick-radius-bot"
          git config user.email "bot@users.noreply.github.com"
          if ! git diff --quiet -- src/data/venue-events.json; then
            git add src/data/venue-events.json
            git commit -m "data: refresh venue events (automated)"
            git pull --rebase origin "${GITHUB_REF_NAME:-main}" || true
            git push origin "HEAD:${GITHUB_REF_NAME:-main}"
          else
            echo "No venue event changes."
          fi
