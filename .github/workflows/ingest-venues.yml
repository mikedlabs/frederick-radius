name: Ingest venue events
run-name: Ingest venue events (firecrawl=${{ github.event_name == 'workflow_dispatch' && inputs.include_model_sources && vars.VENUE_FIRECRAWL_FETCH_FALLBACK || '0' }}, cap=${{ github.event_name == 'workflow_dispatch' && inputs.include_model_sources && vars.VENUE_FIRECRAWL_FALLBACK_MAX_REQUESTS || '1' }})

# Captures lineups from venues that only post on their own site
# (the official Weinberg calendar, The Banyan, Sky Stage, and others). Runs the venue
# native collectors daily without a model, browser, or paid provider.
# Explicit manual model collection keeps its dedicated Data Enrichment key
# and existing paid-review pause. Both modes use the protected review publisher.
# Configure: config/venue-sources.json

on:
  schedule:
    - cron: "7 11 * * *"
  workflow_dispatch:
    inputs:
      include_model_sources:
        description: "Explicitly include paid model-assisted venue sources"
        required: false
        type: boolean
        default: false
      refresh_open_review:
        description: "I want to replace the currently open venue-event review with a fresh paid run"
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ vars.VENUE_FIRECRAWL_FETCH_FALLBACK == '1' && 'operator-firecrawl-fallback-budget' || 'ingest-venue-events' }}
  cancel-in-progress: false

jobs:
  review-gate:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.include_model_sources }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      should_run: ${{ steps.review.outputs.should_run }}
    steps:
      - name: Pause paid extraction while its review is open
        id: review
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REFRESH_OPEN_REVIEW: ${{ inputs.refresh_open_review || 'false' }}
        with:
          script: |
            const branch = 'bot/venue-event-refresh';
            const override = process.env.REFRESH_OPEN_REVIEW === 'true';
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'main',
              per_page: 100,
            });
            const review = pulls.find((pull) =>
              pull.head?.ref === branch &&
              pull.head?.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`
            );

            if (review && !override) {
              core.notice(`Skipping paid extraction while review PR #${review.number} is open: ${review.html_url}`);
              core.summary
                .addHeading('Venue extraction paused')
                .addRaw(`Review PR [#${review.number}](${review.html_url}) before spending on another run.\n`)
                .addRaw('Use the manual refresh_open_review override only when replacing that review is intentional.\n');
              await core.summary.write();
              core.setOutput('should_run', 'false');
              return;
            }

            if (review && override) {
              core.notice(`Manual override accepted; paid extraction may update review PR #${review.number}.`);
            }
            core.setOutput('should_run', 'true');

  # Native feeds have an independent admission path: an old paid review, model
  # key, environment approval or browser installation cannot stop this cohort.
  native:
    if: ${{ github.ref == 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && inputs.include_model_sources) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.artifact-name.outputs.name }}
      review_required: ${{ steps.extract.outputs.review_required }}
      future_additions: ${{ steps.extract.outputs.future_additions }}
      future_removals: ${{ steps.extract.outputs.future_removals }}
      expired_removals: ${{ steps.extract.outputs.expired_removals }}
      failed_sources: ${{ steps.extract.outputs.failed_sources }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - name: Verify native source selection, promotion and review
        run: >-
          npx vitest run tests/venue-collection-mode.spec.ts
          tests/venue-collection-review.spec.ts tests/venue-native-collection.spec.ts
          tests/venue-native-workflow.spec.ts tests/venue-event-alternatives.spec.ts
          tests/venue-event-promotion.spec.ts tests/squarespace-events.spec.ts
          tests/weinberg-events.spec.ts --maxWorkers=2 --no-file-parallelism
      - name: Collect three reviewed native venue sources
        id: extract
        run: npm run ingest:venues -- --deterministic-only
      - name: Verify native event provenance and voice
        run: |
          npm run style:lint
          npx vitest run tests/venue-events-copy.spec.ts tests/venue-event-time.spec.ts
          npm run data:release:write -- --stream venue-events
      - name: Stage exact native review files
        run: |
          set -euo pipefail
          for path in src/data/venue-event-source-inventory.json src/data/venue-events.json src/data/venue-event-source-state.json src/data/data-release.json; do
            install -D -m 0644 "$path" "$RUNNER_TEMP/native-venue-output/$path"
          done
      - name: Pin native output to this generator attempt
        id: artifact-name
        env:
          ARTIFACT_NAME: native-venue-review-${{ github.run_id }}-${{ github.run_attempt }}
        run: echo "name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
      - name: Upload bounded native review artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: ${{ runner.temp }}/native-venue-output
          if-no-files-found: error
          retention-days: 7
      - name: Report source-specific native outcome
        if: always()
        env:
          FAILED_SOURCES: ${{ steps.extract.outputs.failed_sources }}
          REVIEW_REQUIRED: ${{ steps.extract.outputs.review_required }}
        run: |
          echo "Native cohort: Banyan, Weinberg and New Spire. Failed sources retain their old inventory and observation; successful sources can advance independently. Failed sources: $FAILED_SOURCES. Future fact review required: $REVIEW_REQUIRED. Collection is not merged production publication." >> "$GITHUB_STEP_SUMMARY"

  ingest:
    needs: review-gate
    if: ${{ needs.review-gate.outputs.should_run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    environment: "Data Enrichment"
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    outputs:
      artifact_name: ${{ steps.artifact-name.outputs.name }}
    steps:
      - name: Require venue extraction configuration
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_VENUE_EVENTS_API_KEY }}
          FIRECRAWL_FETCH_FALLBACK: ${{ vars.VENUE_FIRECRAWL_FETCH_FALLBACK || '0' }}
          FIRECRAWL_FALLBACK_MAX_REQUESTS: ${{ vars.VENUE_FIRECRAWL_FALLBACK_MAX_REQUESTS || '1' }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error title=Missing ANTHROPIC_VENUE_EVENTS_API_KEY::Add the standard API key to the Data Enrichment environment before running venue extraction."
            exit 1
          fi
          case "$FIRECRAWL_FETCH_FALLBACK" in
            0) ;;
            1) ;;
            *)
              echo "::error title=Invalid Firecrawl setting::FIRECRAWL_FETCH_FALLBACK must be 0 or 1."
              exit 1
              ;;
          esac
          case "$FIRECRAWL_FALLBACK_MAX_REQUESTS" in
            ''|*[!0-9]*)
              echo "::error title=Invalid Firecrawl request cap::Use 1 or 2."
              exit 1
              ;;
          esac
          if [ "$FIRECRAWL_FALLBACK_MAX_REQUESTS" -lt 1 ] || [ "$FIRECRAWL_FALLBACK_MAX_REQUESTS" -gt 2 ]; then
            echo "::error title=Invalid Firecrawl request cap::Use 1 or 2."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Enforce shared Firecrawl fallback budget
        id: firecrawl-budget
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CURRENT_WORKFLOW_FILE: ingest-venues.yml
          FIRECRAWL_FETCH_FALLBACK: ${{ vars.VENUE_FIRECRAWL_FETCH_FALLBACK || '0' }}
          FIRECRAWL_FALLBACK_MAX_REQUESTS: ${{ vars.VENUE_FIRECRAWL_FALLBACK_MAX_REQUESTS || '1' }}
          FIRECRAWL_LEGACY_DISABLED_RUN_IDS: ${{ vars.FIRECRAWL_LEGACY_DISABLED_RUN_IDS || '' }}
        with:
          script: |
            const { enforceFirecrawlFallbackBudget } = require("./scripts/lib/firecrawl-fallback-budget.cjs");
            await enforceFirecrawlFallbackBudget({ github, context, core });
      - name: Verify enabled Firecrawl fallback secret
        if: ${{ success() && steps.firecrawl-budget.outputs.allowed == 'true' && steps.firecrawl-budget.outputs.enabled == 'true' }}
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          if [ -z "$FIRECRAWL_API_KEY" ]; then
            echo "::error title=Missing FIRECRAWL_API_KEY::The Firecrawl fallback passed its shared budget gate, but the Data Enrichment environment has no key."
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci
      - name: Install Chromium
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium
      - name: Extract venue events
        id: extract
        if: ${{ success() && steps.firecrawl-budget.outputs.allowed == 'true' }}
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_VENUE_EVENTS_API_KEY }}
          FIRECRAWL_API_KEY: ${{ steps.firecrawl-budget.outputs.allowed == 'true' && steps.firecrawl-budget.outputs.enabled == 'true' && secrets.FIRECRAWL_API_KEY || '' }}
          FIRECRAWL_FETCH_FALLBACK: ${{ vars.VENUE_FIRECRAWL_FETCH_FALLBACK || '0' }}
          FIRECRAWL_FALLBACK_MAX_REQUESTS: ${{ vars.VENUE_FIRECRAWL_FALLBACK_MAX_REQUESTS || '1' }}
        run: npm run ingest:venues -- --include-model-sources
      # Commits pushed with GITHUB_TOKEN do not start another workflow run.
      # Run the copy/provenance gates here before the bot writes to main.
      - name: Verify venue copy provenance and voice
        id: verify
        if: ${{ always() }}
        run: |
          npm run style:lint
          npx vitest run tests/venue-events-copy.spec.ts tests/squarespace-events.spec.ts tests/weinberg-events.spec.ts tests/venue-event-alternatives.spec.ts
      - name: Promote reviewed venue-event artifacts
        if: ${{ always() && steps.extract.outcome == 'success' && steps.verify.outcome == 'success' }}
        run: npm run data:release:write -- --stream venue-events
      - name: Stage exact review files
        if: ${{ always() && steps.extract.outcome == 'success' && steps.verify.outcome == 'success' }}
        run: |
          set -euo pipefail
          install -D -m 0644 src/data/venue-event-source-inventory.json "$RUNNER_TEMP/automated-pr-output/src/data/venue-event-source-inventory.json"
          install -D -m 0644 src/data/venue-events.json "$RUNNER_TEMP/automated-pr-output/src/data/venue-events.json"
          install -D -m 0644 src/data/venue-event-source-state.json "$RUNNER_TEMP/automated-pr-output/src/data/venue-event-source-state.json"
          install -D -m 0644 src/data/data-release.json "$RUNNER_TEMP/automated-pr-output/src/data/data-release.json"

      - name: Pin review artifact name to this generator attempt
        id: artifact-name
        if: ${{ always() && steps.extract.outcome == 'success' && steps.verify.outcome == 'success' }}
        env:
          ARTIFACT_NAME: venue-event-review-${{ github.run_id }}-${{ github.run_attempt }}
        run: echo "name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload isolated review artifact
        if: ${{ always() && steps.extract.outcome == 'success' && steps.verify.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: ${{ runner.temp }}/automated-pr-output
          if-no-files-found: error
          retention-days: 1
      - name: Enforce complete venue extraction
        if: ${{ always() && steps.extract.outcome != 'success' }}
        run: |
          echo "The deterministic venue feeds were allowed to refresh, but at least one model-assisted source could not run."
          echo "Check ANTHROPIC_VENUE_EVENTS_API_KEY in the Data Enrichment environment and the extraction log above."
          exit 1

  publish:
    needs: [native, ingest]
    if: ${{ always() && (needs.native.result == 'success' || needs.ingest.result == 'success') }}
    permissions:
      actions: read
      contents: write
      pull-requests: write
    uses: ./.github/workflows/publish-automated-pr.yml
    with:
      artifact: ${{ needs.native.outputs.artifact_name || needs.ingest.outputs.artifact_name }}
      base_sha: ${{ github.sha }}
      branch: ${{ needs.native.result == 'success' && 'bot/venue-native-refresh' || 'bot/venue-event-refresh' }}
      allowed_paths: |
        src/data/venue-event-source-inventory.json
        src/data/venue-events.json
        src/data/venue-event-source-state.json
        src/data/data-release.json
      commit_message: "data: refresh venue events (automated)"
      title: "data: refresh venue events"
      auto_merge: ${{ needs.native.result == 'success' && needs.native.outputs.review_required == 'false' }}
      body: |
        Native daily collection is limited to Banyan, Weinberg and New Spire;
        model sources require explicit manual admission and their existing paid
        review gate. Both modes preserve per-source provenance and completeness.

        Native future additions/changes: ${{ needs.native.outputs.future_additions }}.
        Native future removals/changes: ${{ needs.native.outputs.future_removals }}.
        Proven expired rows removed: ${{ needs.native.outputs.expired_removals }}.
        Failed native sources retained: ${{ needs.native.outputs.failed_sources }}.
        Native semantic review required: ${{ needs.native.outputs.review_required }}.
        Only unchanged native facts, actual observations and safe past expiry
        may queue auto-merge after all required checks. Changed future facts and
        all manually requested model output require review. Repeated collection
        compares against current main and cannot approve its pending changes.

        The workflow ran the Radius copy/provenance checks before opening
        this PR. Review event times, source links, and unexpected row-count
        changes before merging.

  checks:
    needs: publish
    if: ${{ needs.publish.outputs.pr_operation == 'created' || needs.publish.outputs.pr_operation == 'updated' }}
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/automated-pr-checks.yml
    with:
      branch: ${{ needs.publish.outputs.pr_branch }}
      head_sha: ${{ needs.publish.outputs.pr_head_sha }}
