name: Mobile performance budget

on:
  schedule:
    # Weekly, off the top of the hour. PRs keep the small resilience browser
    # gate; this heavier six-route Lighthouse pass measures the deployed app
    # through the same production CDN and serverless path visitors use.
    - cron: "43 9 * * 1"
  workflow_dispatch:

concurrency:
  group: mobile-performance-budget
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Enforce key-route mobile budgets
        run: >-
          npm run perf --
          --url=https://frederickradius.app
          --label=production-${GITHUB_SHA::12}
          --runs=3
          --enforce

      - name: Upload Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-performance-reports
          path: .perf
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
