name: Mobile performance budget

on:
  schedule:
    - cron: "15 17 * * *"
  workflow_dispatch: {}

concurrency:
  group: mobile-performance-budget
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    if: ${{ github.repository == 'mikedlabs/frederick-radius' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, Linux, X64, radius-browser]
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify browser image contract
        run: |
          set -euo pipefail
          test -x "$CHROME_PATH"
          node -e 'const lock = require("./package-lock.json"); const expected = process.env.PLAYWRIGHT_IMAGE_VERSION; for (const name of ["node_modules/@playwright/test", "node_modules/playwright-core"]) { const actual = lock.packages?.[name]?.version; if (!expected || actual !== expected) throw new Error(`${name} ${actual ?? "missing"} does not match browser image ${expected ?? "missing"}`); }'
          npx playwright --version

      - name: Enforce key-route mobile budgets
        run: >-
          npm run perf --
          --url=https://frederickradius.app
          --label=production-monitor-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          --audit-code-revision=${GITHUB_SHA}
          --require-stable-deployment
          --runs=3
          --enforce

      - name: Upload Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-performance-reports
          path: .perf
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
