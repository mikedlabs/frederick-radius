name: Source intelligence
run-name: >-
  Source intelligence (${{
    github.event_name == 'schedule' &&
      (github.event.schedule == '11 14 2,16 * *' ||
       github.event.schedule == '21 14 5,19 * *' ||
       github.event.schedule == '31 14 8,22 * *' ||
       github.event.schedule == '41 14 11 * *' ||
       github.event.schedule == '51 14 25 * *') && 'tavily-live' ||
    inputs.tool == 'tavily-scout' && inputs.confirm_live && 'tavily-live' ||
    inputs.tool == 'firecrawl-watch' && inputs.confirm_live && 'firecrawl-live' ||
    'plan'
  }})

# Review-only scheduled and manual checks of first-party sources.
# This workflow never writes canonical app data, commits changes, or publishes
# provider output. Every schedule maps to one tracked Tavily profile; Firecrawl
# Source Watch remains manually dispatched until its unchanged-repeat proof.
on:
  schedule:
    - cron: "11 14 2,16 * *"
    - cron: "21 14 5,19 * *"
    - cron: "31 14 8,22 * *"
    - cron: "41 14 11 * *"
    - cron: "51 14 25 * *"
  workflow_dispatch:
    inputs:
      tool:
        description: "Choose a zero-cost plan/recovery or one capped live provider run"
        required: true
        type: choice
        default: tavily-plan
        options:
          - tavily-plan
          - tavily-recover
          - tavily-scout
          - firecrawl-watch
      profile:
        description: "Reviewed Tavily discovery profile"
        required: true
        type: choice
        default: menus-reservations-accessibility
        options:
          - provider-smoke
          - official-civic-mdot
          - official-new-events
          - menus-reservations-accessibility
          - food-truck-schedules
          - unresolved-source-recovery
      source:
        description: "Exact reviewed Firecrawl page for a one-source pilot"
        required: true
        type: choice
        default: weinberg-performances
        options:
          - downtown-frederick-events
          - celebrate-frederick-events
          - great-frederick-fair-schedule
          - visit-frederick-events
          - weinberg-performances
          - sky-stage-calendar
          - delaplaine-events
          - maryland-ensemble-events
          - frederick-center-events
          - mdcc-deaf-community-events
          - city-emergency-alerts
          - county-health-alerts
          - county-connector-schedules
          - county-food-truck-roster
      confirm_live:
        description: "Required for a live provider request"
        required: true
        type: boolean
        default: false
      initialize_state:
        description: "Allow the first live run to create a new budget ledger and comparison baseline"
        required: true
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: source-intelligence-pilot
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    steps:
      - name: Checkout without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve exact provider target
        id: selection
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule || '' }}
          INPUT_TOOL: ${{ inputs.tool || '' }}
          INPUT_PROFILE: ${{ inputs.profile || '' }}
          INPUT_SOURCE: ${{ inputs.source || '' }}
          INPUT_CONFIRM_LIVE: ${{ inputs.confirm_live && 'true' || 'false' }}
          INPUT_INITIALIZE_STATE: ${{ inputs.initialize_state && 'true' || 'false' }}
        with:
          script: |
            const { resolveSourceIntelligenceSelection } = require("./scripts/lib/source-intelligence-schedule.cjs");
            const selection = resolveSourceIntelligenceSelection({
              eventName: process.env.EVENT_NAME,
              eventSchedule: process.env.EVENT_SCHEDULE,
              tool: process.env.INPUT_TOOL,
              profile: process.env.INPUT_PROFILE,
              source: process.env.INPUT_SOURCE,
              confirmLive: process.env.INPUT_CONFIRM_LIVE,
              initializeState: process.env.INPUT_INITIALIZE_STATE,
            });
            core.setOutput("mode", selection.mode);
            core.setOutput("tool", selection.tool);
            core.setOutput("profile", selection.profile);
            core.setOutput("source", selection.source);
            core.setOutput("live", String(selection.live));
            core.setOutput("initialize_state", String(selection.initializeState));

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The provider cache and attempted-credit ledgers must survive ephemeral
      # runners or daily/monthly caps would reset on every manual run.
      - name: Restore source intelligence state
        id: source-state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            scripts/reports/source-scout-cache.json
            scripts/reports/source-scout-usage.json
            scripts/reports/source-watch/state.json
          key: source-intelligence-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            source-intelligence-state-

      - name: Zero-cost Tavily plan and preflight
        if: ${{ steps.selection.outputs.tool == 'tavily-plan' || steps.selection.outputs.tool == 'tavily-scout' }}
        env:
          SCOUT_PROFILE: ${{ steps.selection.outputs.profile }}
        run: |
          set -o pipefail
          npm run source:scout -- --profile="$SCOUT_PROFILE" 2>&1 | tee source-intelligence.log

      - name: Zero-cost Firecrawl plan and preflight
        if: ${{ steps.selection.outputs.tool == 'firecrawl-watch' }}
        env:
          WATCH_SOURCE: ${{ steps.selection.outputs.source }}
        run: |
          set -o pipefail
          npm run source:watch -- --source="$WATCH_SOURCE" 2>&1 | tee source-intelligence.log

      - name: Require explicit live confirmation
        if: ${{ steps.selection.outputs.tool != 'tavily-plan' && steps.selection.outputs.tool != 'tavily-recover' && steps.selection.outputs.live != 'true' }}
        run: |
          echo "::error title=Live confirmation required::Run the workflow again with confirm_live checked."
          exit 1

      - name: Keep live budget state on main
        if: ${{ (steps.selection.outputs.live == 'true' || steps.selection.outputs.mode == 'recovery') && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error title=Live pilots run from main only::Choose the main branch so provider budgets and comparison state cannot split across branch-scoped caches."
          exit 1

      - name: Validate restored cache state
        id: validate-cache
        if: ${{ steps.selection.outputs.live == 'true' || steps.selection.outputs.mode == 'recovery' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SELECTED_TOOL: ${{ steps.selection.outputs.tool }}
          INITIALIZE_STATE: ${{ steps.selection.outputs.initialize_state }}
        with:
          script: |
            const { inspectLocalState } = require("./scripts/lib/source-intelligence-state.cjs");
            const state = inspectLocalState({
              root: process.cwd(), tool: process.env.SELECTED_TOOL,
              allowUninitialized: process.env.INITIALIZE_STATE === "true",
            });
            core.setOutput("ready", String(state.ready));

      - name: Find newest durable state checkpoint on cache miss
        id: checkpoint-selection
        if: ${{ (steps.selection.outputs.live == 'true' || steps.selection.outputs.mode == 'recovery') && steps.source-state.outputs.cache-matched-key == '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { selectStateCheckpoint } = require("./scripts/lib/source-intelligence-state.cjs");
            const checkpoint = await selectStateCheckpoint({ github, repo: context.repo });
            if (checkpoint) {
              core.setOutput("artifact-id", String(checkpoint.artifactId));
              core.setOutput("run-id", String(checkpoint.provenance.runId));
              core.setOutput("expected", JSON.stringify(checkpoint));
            } else {
              core.info("No durable checkpoint exists. Live runs remain blocked unless this is an explicit first initialization; Tavily history recovery is a separate zero-spend choice.");
            }

      - name: Download exact trusted state checkpoint into staging
        id: checkpoint-download
        if: ${{ steps.checkpoint-selection.outputs.artifact-id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.checkpoint-selection.outputs.artifact-id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.checkpoint-selection.outputs.run-id }}
          path: scripts/reports/source-state-restore
          merge-multiple: true

      - name: Validate and install durable state checkpoint
        id: checkpoint-restore
        if: ${{ steps.checkpoint-selection.outputs.artifact-id != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          EXPECTED_CHECKPOINT: ${{ steps.checkpoint-selection.outputs.expected }}
          SELECTED_TOOL: ${{ steps.selection.outputs.tool }}
          INITIALIZE_STATE: ${{ steps.selection.outputs.initialize_state }}
        with:
          script: |
            const { restoreStateCheckpoint } = require("./scripts/lib/source-intelligence-state.cjs");
            const restored = restoreStateCheckpoint({
              root: process.cwd(), staging: "scripts/reports/source-state-restore",
              expected: JSON.parse(process.env.EXPECTED_CHECKPOINT), tool: process.env.SELECTED_TOOL,
              allowUninitialized: process.env.INITIALIZE_STATE === "true",
            });
            core.setOutput("ready", String(restored.ready));
            core.info("Restored state from a validated main-branch workflow checkpoint.");

      - name: Recover Tavily reservations without provider calls
        id: tavily-recovery
        if: ${{ steps.selection.outputs.mode == 'recovery' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { readSourceIntelligenceHistory, recoverTavilyState } = require("./scripts/lib/source-intelligence-budget.cjs");
            const { inspectLocalState, installValidatedScoutState } = require("./scripts/lib/source-intelligence-state.cjs");
            const runId = Number(process.env.GITHUB_RUN_ID);
            if (runId !== Number(context.runId)) throw new Error("Current run context is uncertain; recovery stopped.");
            const now = new Date();
            const history = await readSourceIntelligenceHistory({
              github, repo: context.repo, now, currentRunId: runId,
              currentAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            });
            const existing = inspectLocalState({ root: process.cwd(), tool: "tavily-recover" });
            const recovered = recoverTavilyState({
              history, now,
              existingUsage: existing.files["scripts/reports/source-scout-usage.json"]?.value,
              existingCache: existing.files["scripts/reports/source-scout-cache.json"]?.value,
            });
            installValidatedScoutState({ root: process.cwd(), ...recovered });
            core.setOutput("recovery", JSON.stringify(recovered.recovery));
            core.info(`Zero-spend recovery preserved conservative reservations. Query cache: ${recovered.recovery.queryCache}; Firecrawl comparison baseline was not initialized.`);
            await core.summary.addRaw(`Tavily reservations recovered from complete authenticated workflow history: ${recovered.recovery.dailyReservedCredits} credits today, ${recovered.recovery.monthlyReservedCredits} this UTC month. Query cache: ${recovered.recovery.queryCache}. No provider request or review issue was made. Firecrawl baseline remains unchanged.\n`).write();

      - name: Enforce durable provider spend ceilings
        id: durable-budget
        if: ${{ steps.selection.outputs.live == 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SELECTED_TOOL: ${{ steps.selection.outputs.tool }}
          INITIALIZE_STATE: ${{ steps.selection.outputs.initialize_state }}
        with:
          script: |
            const { readSourceIntelligenceHistory, calculateReservationFloor, assertFirstProviderInitialization } = require("./scripts/lib/source-intelligence-budget.cjs");
            try {
              const runId = Number(process.env.GITHUB_RUN_ID);
              if (runId !== Number(context.runId)) throw new Error("Current run context is uncertain; no provider request is allowed.");
              const now = new Date();
              const history = await readSourceIntelligenceHistory({
                github, repo: context.repo, now, currentRunId: runId,
                currentAttempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              });
              const floor = calculateReservationFloor(history, { tool: process.env.SELECTED_TOOL, now });
              if (process.env.INITIALIZE_STATE === "true") {
                assertFirstProviderInitialization(history, { tool: process.env.SELECTED_TOOL, now });
              }
              core.setOutput("provider", floor.provider);
              core.setOutput("day", floor.day);
              core.setOutput("month", floor.month);
              core.setOutput("daily-reserved-credits", String(floor.dailyReservedCredits));
              core.setOutput("monthly-reserved-credits", String(floor.monthlyReservedCredits));
              core.info(`${floor.provider} durable reservation floor: ${floor.dailyReservedCredits}/${floor.dailyCeiling} credits today; ${floor.monthlyReservedCredits}/${floor.monthlyCeiling} this UTC month.`);
            } catch (error) {
              core.setFailed(error.message);
            }

      - name: Protect persistent budgets and comparison state
        if: ${{ steps.selection.outputs.live == 'true' && steps.selection.outputs.initialize_state != 'true' }}
        env:
          VALIDATED_CACHE_READY: ${{ steps.validate-cache.outputs.ready }}
          VALIDATED_CHECKPOINT_READY: ${{ steps.checkpoint-restore.outputs.ready }}
        run: |
          if [ "$VALIDATED_CACHE_READY" != "true" ] && [ "$VALIDATED_CHECKPOINT_READY" != "true" ]; then
            echo "::error title=Validated source state is missing::Recover the existing state before spending credits. Tavily recovery reconstructs conservative reservations only; it does not recover a lost query cache or Firecrawl baseline."
            exit 1
          fi

      - name: Run capped Tavily Source Scout
        id: tavily-live
        if: ${{ steps.selection.outputs.tool == 'tavily-scout' && steps.selection.outputs.live == 'true' }}
        env:
          SCOUT_PROFILE: ${{ steps.selection.outputs.profile }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          rm -f scripts/reports/source-scout-github-issue.json
          if [ -z "$TAVILY_API_KEY" ]; then
            echo "::error title=Missing TAVILY_API_KEY::Add a fresh key to the GitHub Production environment."
            exit 1
          fi
          set -o pipefail
          npm run source:scout -- --live --confirm --profile="$SCOUT_PROFILE" 2>&1 | tee -a source-intelligence.log

      - name: Open or update the Source Scout review queue
        id: source-scout-review-queue
        if: ${{ always() && steps.selection.outputs.tool == 'tavily-scout' && steps.selection.outputs.live == 'true' && (steps.tavily-live.outcome == 'success' || steps.tavily-live.outcome == 'failure') && hashFiles('scripts/reports/source-scout-github-issue.json') != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { updateSourceScoutIssues } = require("./scripts/lib/source-scout-issue.cjs");
            await updateSourceScoutIssues({ github, context, core });

      - name: Run one-source Firecrawl Source Watch pilot
        id: firecrawl-live
        if: ${{ steps.selection.outputs.tool == 'firecrawl-watch' && steps.selection.outputs.live == 'true' }}
        env:
          WATCH_SOURCE: ${{ steps.selection.outputs.source }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          rm -f scripts/reports/source-watch/github-issue.json
          if [ -z "$FIRECRAWL_API_KEY" ]; then
            echo "::error title=Missing FIRECRAWL_API_KEY::Add the key to the GitHub Production environment."
            exit 1
          fi
          set -o pipefail
          npm run source:watch -- --live --confirm --source="$WATCH_SOURCE" 2>&1 | tee source-intelligence.log

      - name: Open or update the per-source review queue
        id: source-watch-review-queue
        if: ${{ always() && steps.selection.outputs.tool == 'firecrawl-watch' && steps.selection.outputs.live == 'true' && (steps.firecrawl-live.outcome == 'success' || steps.firecrawl-live.outcome == 'failure') && hashFiles('scripts/reports/source-watch/github-issue.json') != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { updateSourceWatchIssues } = require("./scripts/lib/source-watch-issue.cjs");
            await updateSourceWatchIssues({ github, context, core });

      - name: Add operator result to job summary
        if: always()
        run: |
          {
            echo "## Source intelligence"
            echo
            echo "Review evidence only. No Radius data was published."
            echo
            echo '```text'
            cat source-intelligence.log 2>/dev/null || echo "No provider run was completed."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-intelligence-${{ steps.selection.outputs.tool }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source-intelligence.log
            scripts/reports/source-scout-latest.json
            scripts/reports/source-scout-github-issue.json
            scripts/reports/source-watch/source-watch-*.json
            scripts/reports/source-watch/github-issue.json
          if-no-files-found: warn
          retention-days: 14

      # Tavily reserves attempted credits before each request, including failed
      # requests. Preserve those ledgers even when the provider or issue fails.
      # Firecrawl comparison hashes advance only after review-queue delivery.
      - name: Prepare durable state checkpoint
        id: checkpoint-write
        if: ${{ always() && github.ref == 'refs/heads/main' && ((steps.selection.outputs.mode == 'recovery' && steps.tavily-recovery.outcome == 'success') || (steps.selection.outputs.live == 'true' && ((steps.selection.outputs.tool == 'tavily-scout' && (steps.tavily-live.outcome == 'success' || steps.tavily-live.outcome == 'failure')) || (steps.selection.outputs.tool == 'firecrawl-watch' && steps.source-watch-review-queue.outcome == 'success')))) }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SELECTED_TOOL: ${{ steps.selection.outputs.tool }}
          RECOVERY_EVIDENCE: ${{ steps.tavily-recovery.outputs.recovery }}
        with:
          script: |
            const { readCheckpointProvenance, prepareStateCheckpoint, checkpointRetentionDays } = require("./scripts/lib/source-intelligence-state.cjs");
            core.setOutput("retention-days", String(checkpointRetentionDays(process.env.GITHUB_RETENTION_DAYS)));
            const provenance = await readCheckpointProvenance({
              github, repo: context.repo, runId: Number(context.runId),
              attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            });
            prepareStateCheckpoint({
              root: process.cwd(), destination: "scripts/reports/source-state-checkpoint",
              provenance, tool: process.env.SELECTED_TOOL,
              recovery: process.env.RECOVERY_EVIDENCE ? JSON.parse(process.env.RECOVERY_EVIDENCE) : undefined,
            });

      - name: Upload durable state checkpoint
        id: checkpoint-upload
        if: ${{ always() && steps.checkpoint-write.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-intelligence-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: scripts/reports/source-state-checkpoint/
          if-no-files-found: error
          retention-days: ${{ steps.checkpoint-write.outputs.retention-days }}

      - name: Save source intelligence state
        if: ${{ always() && steps.checkpoint-write.outcome == 'success' && (steps.selection.outputs.tool != 'firecrawl-watch' || steps.source-watch-review-queue.outcome == 'success') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            scripts/reports/source-scout-cache.json
            scripts/reports/source-scout-usage.json
            scripts/reports/source-watch/state.json
          key: source-intelligence-state-${{ github.run_id }}-${{ github.run_attempt }}
