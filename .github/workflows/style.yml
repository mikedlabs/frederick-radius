name: style

run-name: >-
  ${{ inputs.automated_pr_token != '' && format('style / automated {0}', inputs.automated_pr_token) || format('style / {0}', github.ref_name) }}

# Voice guard. The prior external audit found em dashes shipped on
# /plan because nothing mechanical enforced the editorial rules. This
# job runs the rule-based lint on every pull request and fails the PR
# on any violation. See docs/briefs/2026-05-18-external-audit-actions.md
# section 4.4.

on:
  pull_request: {}
  workflow_dispatch:
    inputs:
      automated_pr_head_sha:
        description: Exact trusted bot head validated by automated-pr-checks
        required: false
        type: string
      automated_pr_token:
        description: One-time correlation token for an automated PR gate pair
        required: false
        type: string

permissions:
  contents: read

# A new PR commit makes the prior voice scan obsolete. Do not pay for both.
concurrency:
  group: style-${{ github.ref }}
  cancel-in-progress: true

jobs:
  style-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Voice lint
        run: npm run style:lint

      - name: Brand color lint
        run: npm run lint:colors

      - name: Layer scale lint
        run: npm run lint:zindex

      - name: Type scale lint
        run: npm run lint:type
