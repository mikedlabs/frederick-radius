name: style

# STYLE.md guard. The prior external audit found em dashes shipped on
# /plan because nothing mechanical enforced the editorial rules. This
# job runs the rule-based lint on every pull request and fails the PR
# on any violation. See docs/briefs/2026-05-18-external-audit-actions.md
# section 4.4.

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  style-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # `npm install` instead of `npm ci` — different local Node
        # versions (the project is currently maintained on Node 25)
        # resolve transitive deps (notably esbuild via Vite peerDeps)
        # slightly differently from Node 20 in CI, which `npm ci` flags
        # as a lock mismatch. `style:lint` is rule-based and doesn't
        # need bit-exact deps; tolerate the drift and unblock merge.
        run: npm install --no-audit --no-fund

      - name: STYLE.md lint
        run: npm run style:lint
