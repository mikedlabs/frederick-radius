name: style

# Voice guard. The prior external audit found em dashes shipped on
# /plan because nothing mechanical enforced the editorial rules. This
# job runs the rule-based lint on every pull request and fails the PR
# on any violation. See docs/briefs/2026-05-18-external-audit-actions.md
# section 4.4.

on:
  pull_request: {}
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  style-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Voice lint
        run: npm run style:lint
