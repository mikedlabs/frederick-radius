name: UX browser audit

on:
  schedule:
    # 4:17 AM Eastern during daylight-saving time. The uneven minute avoids
    # GitHub Actions' crowded top-of-hour scheduler window.
    - cron: "17 8 * * *"
  workflow_dispatch:

concurrency:
  group: ux-browser-audit
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile UX and safe-interaction audit
        run: npm run test:ux
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Keep failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ux-browser-failure-traces
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
