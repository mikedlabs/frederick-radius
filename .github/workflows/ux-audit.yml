name: UX browser audit

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch: {}

concurrency:
  group: ux-browser-audit
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile-ux:
    name: Mobile UX
    if: ${{ github.repository == 'mikedlabs/frederick-radius' && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, Linux, X64, radius-browser]
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify browser image contract
        run: |
          set -euo pipefail
          test -x "$CHROME_PATH"
          node -e 'const lock = require("./package-lock.json"); const expected = process.env.PLAYWRIGHT_IMAGE_VERSION; for (const name of ["node_modules/@playwright/test", "node_modules/playwright-core"]) { const actual = lock.packages?.[name]?.version; if (!expected || actual !== expected) throw new Error(`${name} ${actual ?? "missing"} does not match browser image ${expected ?? "missing"}`); }'
          npx playwright --version
      - name: Build the production app once
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Next's route/type analysis crosses Node's ~2 GB default heap on a
          # cold Linux runner, exactly as ci.yml already documents at its own
          # build steps. The axe gate remains pinned at zero violations.
          NODE_OPTIONS: "--max-old-space-size=4096"
      - name: Run mobile UX and safe-interaction audit
        # Leave enough of the job budget for Playwright to flush traces and for
        # the artifact step below to upload them when the audit times out.
        run: >-
          timeout --signal=TERM --kill-after=1m 30m
          npx playwright test
          e2e/ux-audit.spec.ts
          e2e/safe-interaction-crawler.spec.ts
          --project=chromium
          --workers=2
          --retries=1
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          PW_PRODUCTION: "1"
      - name: Keep failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ux-browser-failure-traces
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
