name: CI

# The mechanical quality gate the repo was missing: typecheck, lint,
# unit tests, and a production build on every PR. The protected main branch
# already requires these checks against an up-to-date merge revision, so
# rebuilding the identical tree after merge would spend runner time without
# adding another release decision. Vercel's production canary owns the
# post-merge check.
# Until now CI only ran editorial-style + data-freshness checks, so a
# type error or failing test could land on main unnoticed — especially
# risky with autonomous agents committing. A green check here is the
# enforceable version of "tests must pass before committing."

on:
  pull_request: {}
  # Bot-created pull requests use the repository token. GitHub holds their
  # pull_request runs for manual approval, so the creating workflow explicitly
  # dispatches these same secret-free gates on the allowlisted bot branch.
  workflow_dispatch: {}

# Cancel superseded runs on the same ref so a rapid push series doesn't
# queue stale builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Enforce tracked-file size budget
        run: npm run audit:repo-size
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Audit data-source registry
        run: npm run audit:sources
      - name: Audit migration ledger
        run: npm run db:audit
      - name: Validate committed transit data
        run: npm run validate:transit-data
      - name: Unit tests
        run: npm run test:all
      - name: Production helper tests
        run: >-
          node --test
          scripts/lib/production-rollback.test.mjs
          scripts/lib/basemap-platform.test.mjs
          scripts/lib/basemap-release.test.mjs
          scripts/lib/data-release.test.mjs
          scripts/lib/prod-audit-deploy-only.test.mjs
          scripts/lib/prod-audit-data.test.mjs
          scripts/lib/promoted-build-network-guard.test.mjs
      - name: Build
        run: npm run build
        env:
          # Build must not require real secrets; the app is written to
          # degrade when these are absent. Provide empty defaults so the
          # build exercises the real code paths without external calls.
          NEXT_TELEMETRY_DISABLED: "1"
          # Next's route/type analysis crosses Node's ~2 GB default heap on a
          # cold Linux runner. Keep enough headroom for the OS and Chromium.
          NODE_OPTIONS: "--max-old-space-size=4096"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Production browser and connected-journey gate
        run: npm run test:release
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          PW_PRODUCTION: "1"
      - name: Required browser chaos
        run: >-
          npx playwright test
          e2e/critical-dependency-chaos.spec.ts
          e2e/service-worker-upgrade-contract.spec.ts
          --project=chromium
          --workers=1
          --retries=1
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          PW_PRODUCTION: "1"
      - name: Keep browser failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-browser-failure-traces
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  browser-chaos:
    # Keep this job name stable: the main-branch ruleset requires this exact
    # context. The real chaos tests now run inside `verify`, reusing its one
    # production build and Chromium install. This lightweight mirror cannot
    # pass unless that complete job, including the chaos tests, passed.
    name: Required browser chaos
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm the verified build and chaos suite passed
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          if [ "$VERIFY_RESULT" != "success" ]; then
            echo "::error title=Required browser gate failed::The verify job, including the real browser chaos suite, concluded $VERIFY_RESULT."
            exit 1
          fi
          echo "The verified production build and browser chaos suite passed."
