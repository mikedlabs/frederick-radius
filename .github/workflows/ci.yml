name: CI

run-name: >-
  ${{ inputs.automated_pr_token != '' && format('CI / automated {0}', inputs.automated_pr_token) || format('CI / {0}', github.ref_name) }}

# The mechanical quality gate the repo was missing: typecheck, lint,
# unit tests, and one production build on every PR. Vercel owns the one
# post-merge build from main; rebuilding the same reviewed revision in Actions
# spent runner minutes without adding another release decision.
# Until now CI only ran editorial-style + data-freshness checks, so a
# type error or failing test could land on main unnoticed — especially
# risky with autonomous agents committing. A green check here is the
# enforceable version of "tests must pass before committing."

on:
  pull_request:
  # Eligible held native PR runs are approved by the trusted publisher helper.
  # Manual dispatch remains a full diagnostic run; it cannot select data-only.
  workflow_dispatch:
    inputs:
      automated_pr_branch:
        description: Trusted bot branch validated by automated-pr-checks
        required: false
        type: string
      automated_pr_head_sha:
        description: Exact trusted bot head validated by automated-pr-checks
        required: false
        type: string
      automated_pr_style_run_id:
        description: Exact style workflow run paired by automated-pr-checks
        required: false
        type: string
      automated_pr_token:
        description: One-time correlation token for an automated PR gate pair
        required: false
        type: string

# Cancel superseded runs on the same ref so a rapid push series doesn't
# queue stale builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  verify:
    # Match the installed Playwright browser and native-dependency support.
    runs-on: ubuntu-24.04
    # The full build and both browser suites reached 45 minutes before the
    # final upgrade gate. Keep every check and its per-test limits intact;
    # allow one bounded hour instead of discarding completed verification.
    timeout-minutes: 60
    env:
      # Only the pre-checkout protected-main helper may opt into the focused
      # data gate after exact current PR/base/head/tree/path validation.
      # Ordinary code PRs and workflow_dispatch keep full checks; uncertain publishers are held.
      AUTOMATED_DATA_PR: "0"
    steps:
      - name: Classify native automated data PR before repository execution
        id: native_pr
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NATIVE_PR_RECEIPT_PATH: ${{ runner.temp }}/native-pr-preflight.json
        with:
          script: |
            const pull = context.payload.pull_request;
            const candidateHint = pull?.head?.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`
              && /^bot\//.test(pull?.head?.ref || '');
            let receipt = { schema_version: 1, mode: candidateHint ? 'held' : 'full', verified: false, phase: 'bootstrap' };
            core.setOutput('data_only', 'false');
            try {
              const main = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
              const trustedMainSha = main.data.object.sha;
              if (!/^[0-9a-f]{40}$/.test(trustedMainSha || '')) throw new Error('Invalid protected main revision.');
              const helperPath = 'scripts/lib/native-automated-pr-gates.cjs';
              const response = await github.rest.repos.getContent({ ...context.repo, path: helperPath, ref: trustedMainSha });
              const file = response.data;
              if (file.type !== 'file' || file.path !== helperPath || file.encoding !== 'base64'
                || !Number.isSafeInteger(file.size) || file.size <= 0 || file.size > 65536) {
                throw new Error('Invalid bounded protected-main native gate helper.');
              }
              const source = Buffer.from(file.content, 'base64');
              if (source.length !== file.size) throw new Error('Native gate helper size mismatch.');
              const trusted = { exports: {} };
              new Function('module', 'exports', source.toString('utf8'))(trusted, trusted.exports);
              receipt = await trusted.exports.classifyNativeAutomatedPr({ github, context, trustedMainSha });
              const dataOnly = candidateHint && receipt.verified === true && receipt.mode === 'data-only';
              core.setOutput('data_only', String(dataOnly));
              if (dataOnly) core.exportVariable('AUTOMATED_DATA_PR', '1');
              else if (candidateHint || receipt.mode === 'held') {
                core.setFailed('Native publisher identity is unverified. Reconcile the exact data PR against current main before execution.');
              }
            } catch (error) {
              receipt = { schema_version: 1, mode: candidateHint ? 'held' : 'full', verified: false, phase: 'bootstrap', failure: error.message };
              if (candidateHint) core.setFailed('Native publisher preflight unavailable; execution is held with its identity unverified.');
              else core.warning('Native data-only classification unavailable; all application gates remain required.');
            } finally {
              require('fs').writeFileSync(process.env.NATIVE_PR_RECEIPT_PATH,
                JSON.stringify(receipt, null, 2) + '\n', { mode: 0o600 });
              core.info(JSON.stringify(receipt));
              await core.summary.addHeading('Native PR gate classification')
                .addCodeBlock(JSON.stringify(receipt), 'json').write();
            }
      - name: Preserve native PR classification receipt
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-pr-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-pr-preflight.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Enforce tracked-file size budget
        run: npm run audit:repo-size
      - name: Audit production dependencies
        if: ${{ env.AUTOMATED_DATA_PR != '1' }}
        run: npm audit --omit=dev --audit-level=high
      # The heap limit lives in the npm script, not here, so every caller
      # gets it.
      #
      # tsc infers a literal type per entry of the committed JSON catalogs, so
      # its memory tracks the DATA, not the code. A routine hours refresh that
      # restores ~209 places' schedules is enough to push a COLD check past
      # Node's ~2 GB default heap and abort with exit 134. Cold is the only
      # mode that matters here: tsconfig sets incremental, but
      # tsconfig.tsbuildinfo is gitignored, so a fresh CI checkout never has
      # it while a developer's working copy almost always does. That gap is
      # why this failed on every nightly data PR and passed for everyone
      # locally, including on the very data that was failing.
      - name: Typecheck
        if: ${{ env.AUTOMATED_DATA_PR != '1' }}
        run: npm run typecheck
      - name: Lint
        if: ${{ env.AUTOMATED_DATA_PR != '1' }}
        run: npm run lint
      - name: Audit data-source registry
        run: npm run audit:sources
      - name: Audit automation ownership
        run: npm run audit:automation
      - name: Audit migration ledger
        if: ${{ env.AUTOMATED_DATA_PR != '1' }}
        run: npm run db:audit
      - name: Validate committed transit data
        run: npm run validate:transit-data
      - name: Validate automated data artifacts
        if: ${{ env.AUTOMATED_DATA_PR == '1' }}
        run: npm run test:data-artifacts
      - name: Unit tests
        if: ${{ env.AUTOMATED_DATA_PR != '1' }}
        run: npm run test:all
      - name: Build
        if: ${{ env.AUTOMATED_DATA_PR != '1' }}
        run: npm run build
        env:
          # Build must not require real secrets; the app is written to
          # degrade when these are absent. Provide empty defaults so the
          # build exercises the real code paths without external calls.
          NEXT_TELEMETRY_DISABLED: "1"
          # Next's route/type analysis crosses Node's ~2 GB default heap on a
          # cold Linux runner. Keep enough headroom for the OS and Chromium.
          NODE_OPTIONS: "--max-old-space-size=4096"
      - name: Install browsers
        if: ${{ env.AUTOMATED_DATA_PR != '1' }}
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # The runner's Azure HTTP mirror can stall before tests begin.
          # Keep the same signed Ubuntu archive and mirror priorities over HTTPS.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -E -i 's@^([[:space:]]*)http://azure\.archive\.ubuntu\.com/ubuntu(/?)([[:space:]].*|$)@\1https://archive.ubuntu.com/ubuntu\2\3@' /etc/apt/apt-mirrors.txt
          fi
          npx playwright install --with-deps chromium webkit
      - name: Component workshop tests
        if: ${{ env.AUTOMATED_DATA_PR != '1' }}
        run: npm run test:storybook
      - name: WebKit native Today and commerce controls
        if: ${{ env.AUTOMATED_DATA_PR != '1' }}
        run: npm run test:storybook -- src/components/today/TodayEntryControls.stories.tsx src/components/place/CommerceActions.stories.tsx --maxWorkers=1 --no-file-parallelism
        env:
          RADIUS_STORYBOOK_WEBKIT: "1"
      - name: Transit map interaction geometry
        if: ${{ env.AUTOMATED_DATA_PR != '1' }}
        run: npm run test:transit:geometry
        env:
          RADIUS_TRANSIT_GEOMETRY_PROOF_DIR: ${{ github.workspace }}/test-results/transit-geometry
      - name: Production browser and connected-journey gate
        if: ${{ env.AUTOMATED_DATA_PR != '1' }}
        run: npm run test:release
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          PW_PRODUCTION: "1"
      - name: Prepare chromium fixture PNGs
        if: ${{ success() && env.AUTOMATED_DATA_PR != '1' }}
        run: node scripts/lib/visual-fixture-artifact.mjs chromium
      - name: Keep chromium fixture PNGs
        if: ${{ success() && env.AUTOMATED_DATA_PR != '1' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-fixture-pngs-chromium-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-visual-fixtures/chromium
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: WebKit visual discovery and map continuity
        if: ${{ env.AUTOMATED_DATA_PR != '1' }}
        run: >-
          npx playwright test e2e/today-map-visual-depth.spec.ts
          e2e/map-seeded-sheet-continuity.spec.ts
          e2e/events-nearby-visual-cards.spec.ts
          e2e/safari-back-readiness.spec.ts
          e2e/map-place-response-deadline.spec.ts
          e2e/search-scope-quality.spec.ts
          e2e/find-place-media.spec.ts
          e2e/nearby-place-media.spec.ts
          e2e/map-selected-photo-continuity.spec.ts
          e2e/primary-tab-resume.spec.ts
          e2e/events-filter-back.spec.ts
          e2e/place-sheet-quick-actions.spec.ts
          --project=webkit-mobile --workers=1 --retries=1
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          PW_PRODUCTION: "1"
          PW_WEBKIT: "1"
      - name: Prepare webkit-mobile fixture PNGs
        if: ${{ success() && env.AUTOMATED_DATA_PR != '1' }}
        run: node scripts/lib/visual-fixture-artifact.mjs webkit-mobile
      - name: Keep webkit-mobile fixture PNGs
        if: ${{ success() && env.AUTOMATED_DATA_PR != '1' }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-fixture-pngs-webkit-mobile-${{ github.sha }}-${{ github.run_attempt }}
          path: ci-visual-fixtures/webkit-mobile
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Exercise combined dependency failures and app upgrades
        if: ${{ env.AUTOMATED_DATA_PR != '1' }}
        run: >-
          npx playwright test
          e2e/critical-dependency-chaos.spec.ts
          e2e/service-worker-upgrade-contract.spec.ts
          --project=chromium
          --workers=1
          --retries=1
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          PW_PRODUCTION: "1"
      - name: Revalidate native automated data PR after artifact gates
        id: native_pr_recheck
        if: ${{ env.AUTOMATED_DATA_PR == '1' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NATIVE_PR_RECEIPT_PATH: ${{ runner.temp }}/native-pr-final-check.json
        with:
          script: |
            const pull = context.payload.pull_request;
            const candidateHint = pull?.head?.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`
              && /^bot\//.test(pull?.head?.ref || '');
            let receipt = { schema_version: 1, mode: candidateHint ? 'held' : 'full', verified: false, phase: 'bootstrap' };
            core.setOutput('data_only', 'false');
            try {
              const main = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
              const trustedMainSha = main.data.object.sha;
              if (!/^[0-9a-f]{40}$/.test(trustedMainSha || '')) throw new Error('Invalid protected main revision.');
              const helperPath = 'scripts/lib/native-automated-pr-gates.cjs';
              const response = await github.rest.repos.getContent({ ...context.repo, path: helperPath, ref: trustedMainSha });
              const file = response.data;
              if (file.type !== 'file' || file.path !== helperPath || file.encoding !== 'base64'
                || !Number.isSafeInteger(file.size) || file.size <= 0 || file.size > 65536) {
                throw new Error('Invalid bounded protected-main native gate helper.');
              }
              const source = Buffer.from(file.content, 'base64');
              if (source.length !== file.size) throw new Error('Native gate helper size mismatch.');
              const trusted = { exports: {} };
              new Function('module', 'exports', source.toString('utf8'))(trusted, trusted.exports);
              receipt = await trusted.exports.classifyNativeAutomatedPr({ github, context, trustedMainSha });
              const dataOnly = candidateHint && receipt.verified === true && receipt.mode === 'data-only';
              core.setOutput('data_only', String(dataOnly));
              if (dataOnly) core.exportVariable('AUTOMATED_DATA_PR', '1');
              else if (candidateHint || receipt.mode === 'held') {
                core.setFailed('Native publisher identity is unverified. Reconcile the exact data PR against current main before execution.');
              }
            } catch (error) {
              receipt = { schema_version: 1, mode: candidateHint ? 'held' : 'full', verified: false, phase: 'bootstrap', failure: error.message };
              if (candidateHint) core.setFailed('Native publisher preflight unavailable; execution is held with its identity unverified.');
              else core.warning('Native data-only classification unavailable; all application gates remain required.');
            } finally {
              require('fs').writeFileSync(process.env.NATIVE_PR_RECEIPT_PATH,
                JSON.stringify(receipt, null, 2) + '\n', { mode: 0o600 });
              core.info(JSON.stringify(receipt));
              await core.summary.addHeading('Native PR final publication identity')
                .addCodeBlock(JSON.stringify(receipt), 'json').write();
            }
      - name: Preserve final native PR identity receipt
        if: ${{ always() && env.AUTOMATED_DATA_PR == '1' && steps.native_pr_recheck.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-pr-final-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-pr-final-check.json
          if-no-files-found: error
          retention-days: 14
      - name: Keep browser failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-browser-failure-traces
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
