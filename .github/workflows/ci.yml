name: CI

# The mechanical quality gate the repo was missing: typecheck, lint,
# unit tests, and a production build on every PR. Vercel already validates the
# merged revision, so running the same cold build again on every push to main
# spent runner minutes without creating a second review boundary.
# Until now CI only ran editorial-style + data-freshness checks, so a
# type error or failing test could land on main unnoticed — especially
# risky with autonomous agents committing. A green check here is the
# enforceable version of "tests must pass before committing."

on:
  pull_request:
  # The broad dependency-failure sweep is intentionally weekly. The required
  # PR gate already exercises the production browser journeys; rebuilding the
  # same 2,700-page app in a second PR job added roughly 17 billed minutes to
  # every change without being part of the live branch ruleset.
  schedule:
    - cron: "47 8 * * 0"
  # Bot-created pull requests use the repository token. GitHub holds their
  # pull_request runs for manual approval, so the creating workflow explicitly
  # dispatches these same secret-free gates on the allowlisted bot branch.
  workflow_dispatch:
    inputs:
      run_browser_chaos:
        description: Also run the weekly dependency-failure browser sweep
        required: false
        type: boolean
        default: false
      automated_pr_branch:
        description: Trusted bot branch validated by automated-pr-checks
        required: false
        type: string
      automated_pr_head_sha:
        description: Exact trusted bot head validated by automated-pr-checks
        required: false
        type: string
      automated_pr_dispatched_after:
        description: Start of the trusted automated check window
        required: false
        type: string

# Cancel superseded runs on the same ref so a rapid push series doesn't
# queue stale builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # The weekly schedule is reserved for browser chaos. Pull requests and
    # manual/bot dispatches keep the normal required verification job.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Enforce tracked-file size budget
        run: npm run audit:repo-size
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      # The heap limit lives in the npm script, not here, so every caller
      # gets it.
      #
      # tsc infers a literal type per entry of the committed JSON catalogs, so
      # its memory tracks the DATA, not the code. A routine hours refresh that
      # restores ~209 places' schedules is enough to push a COLD check past
      # Node's ~2 GB default heap and abort with exit 134. Cold is the only
      # mode that matters here: tsconfig sets incremental, but
      # tsconfig.tsbuildinfo is gitignored, so a fresh CI checkout never has
      # it while a developer's working copy almost always does. That gap is
      # why this failed on every nightly data PR and passed for everyone
      # locally, including on the very data that was failing.
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Audit data-source registry
        run: npm run audit:sources
      - name: Audit migration ledger
        run: npm run db:audit
      - name: Validate committed transit data
        run: npm run validate:transit-data
      - name: Unit tests
        run: npm run test:all
      - name: Production helper tests
        run: >-
          node --test
          scripts/lib/production-rollback.test.mjs
          scripts/lib/basemap-platform.test.mjs
          scripts/lib/basemap-release.test.mjs
          scripts/lib/data-release.test.mjs
          scripts/lib/promoted-build-network-guard.test.mjs
      - name: Build
        run: npm run build
        env:
          # Build must not require real secrets; the app is written to
          # degrade when these are absent. Provide empty defaults so the
          # build exercises the real code paths without external calls.
          NEXT_TELEMETRY_DISABLED: "1"
          # Next's route/type analysis crosses Node's ~2 GB default heap on a
          # cold Linux runner. Keep enough headroom for the OS and Chromium.
          NODE_OPTIONS: "--max-old-space-size=4096"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Component workshop tests
        run: npm run test:storybook
      - name: Production browser and connected-journey gate
        run: npm run test:release
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          PW_PRODUCTION: "1"
      - name: Keep browser failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-browser-failure-traces
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  browser-chaos:
    # Keep the historical job name so old run links remain understandable, but
    # run it only on the weekly schedule or an explicit manual request. It is a
    # valuable resilience audit, not a duplicate per-PR release build.
    name: Required browser chaos
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_browser_chaos)
    runs-on: ubuntu-latest
    # A cold 2,740-page production build takes about 24 minutes on GitHub's
    # shared runner before Chromium and the actual chaos cases begin. Keep a
    # bounded ceiling, but leave enough time to exercise the thing this job is
    # required to prove instead of cancelling it immediately after the build.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Build the production app
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_OPTIONS: "--max-old-space-size=4096"
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise combined dependency failures and app upgrades
        run: >-
          npx playwright test
          e2e/critical-dependency-chaos.spec.ts
          e2e/service-worker-upgrade-contract.spec.ts
          --project=chromium
          --workers=1
          --retries=1
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          PW_PRODUCTION: "1"
      - name: Keep chaos failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chaos-browser-failure-traces
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  attach-automated-pr-checks:
    # Start the trusted status bridge only after the expensive CI gate ends.
    # The former design started a second runner immediately and paid it to
    # sleep for the full build. Style normally finishes before CI, so the
    # bridge now observes completed work instead of polling for half an hour.
    needs: verify
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.automated_pr_branch != '' &&
      inputs.automated_pr_head_sha != '' &&
      inputs.automated_pr_dispatched_after != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Attach completed bot checks to the merge revision
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AUTOMATED_PR_BRANCH: ${{ inputs.automated_pr_branch }}
          AUTOMATED_PR_HEAD_SHA: ${{ inputs.automated_pr_head_sha }}
          AUTOMATED_PR_DISPATCHED_AFTER: ${{ inputs.automated_pr_dispatched_after }}
        with:
          script: |
            const branch = process.env.AUTOMATED_PR_BRANCH;
            const headSha = process.env.AUTOMATED_PR_HEAD_SHA;
            const dispatchedAfter = process.env.AUTOMATED_PR_DISPATCHED_AFTER;
            if (context.sha !== headSha) {
              core.setFailed(`The dispatched CI revision moved: expected ${headSha}, got ${context.sha}.`);
              return;
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'automated-pr-status-bridge.yml',
              ref: 'main',
              inputs: {
                branch,
                head_sha: headSha,
                dispatched_after: dispatchedAfter,
              },
            });
