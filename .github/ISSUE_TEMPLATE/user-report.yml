name: User-reported problem
description: Capture a real user journey that was confusing, broken, or misleading.
title: "[User report] "
labels: [user-reported]
body:
  - type: textarea
    id: report
    attributes:
      label: What the user experienced
      description: Use the user's own words when possible.
      placeholder: The event disappeared exactly when brunch started at 10:00 AM.
    validations:
      required: true
  - type: textarea
    id: journey
    attributes:
      label: Exact journey
      description: Include the route, controls used, selected town, and signed-in or saved state.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Add screenshots, timestamps, browser/device details, and relevant links. Remove private information.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no private location, account, token, or personal information.
          required: true
