name: Feature request
description: Describe a local need that Frederick Radius could solve better.
title: "[Idea]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Start with the rider, visitor, resident, or business need. A clear problem is more useful than a list of technologies.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Tell us what is difficult today, who experiences it, and when it matters.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: What would a good outcome feel like?
      description: Describe the result rather than prescribing an implementation.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Product area
      options:
        - Today and local discovery
        - Map
        - Events
        - Transit
        - Deals and businesses
        - Alerts and time-sensitive information
        - Saved items and notifications
        - Accessibility
        - Other
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Relevant public source, if any
      description: Link to a source that could support the idea. A link does not automatically grant reuse rights.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Add a simple example or screenshot after removing personal information.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I did not include personal information, credentials, private messages, or exact live location.
          required: true
