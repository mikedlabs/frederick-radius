# The job container can reach only this proxy. Squid resolves approved public
# destinations on the uplink network and rejects every non-CONNECT request,
# non-TLS port, private/link-local destination, and unlisted hostname.
http_port 3128
visible_hostname radius-data-egress
httpd_suppress_version_string on
via off
forwarded_for delete

acl runner_clients src 172.31.255.3/32 172.31.255.4/32
acl CONNECT method CONNECT
acl TLS_port port 443

acl forbidden_destination dst \
  0.0.0.0/8 \
  10.0.0.0/8 \
  100.64.0.0/10 \
  127.0.0.0/8 \
  169.254.0.0/16 \
  172.16.0.0/12 \
  192.0.0.0/24 \
  192.0.2.0/24 \
  192.88.99.0/24 \
  192.168.0.0/16 \
  198.18.0.0/15 \
  198.51.100.0/24 \
  203.0.113.0/24 \
  224.0.0.0/4 \
  240.0.0.0/4 \
  ::/128 \
  ::1/128 \
  2001:db8::/32 \
  fc00::/7 \
  fe80::/10 \
  ff00::/8

# GitHub's documented self-hosted-runner endpoints used for listening,
# checkout/action downloads, setup-node release assets, logs, and artifacts.
acl approved_destination dstdomain -n \
  github.com \
  api.github.com \
  .actions.githubusercontent.com \
  codeload.github.com \
  results-receiver.actions.githubusercontent.com \
  .blob.core.windows.net \
  objects.githubusercontent.com \
  objects-origin.githubusercontent.com \
  github-releases.githubusercontent.com \
  github-registry-files.githubusercontent.com \
  release-assets.githubusercontent.com \
  nodejs.org \
  registry.npmjs.org \
  feeds.mta.maryland.gov \
  mdotmta-gtfs.s3.amazonaws.com \
  passio3.com \
  calendar.google.com \
  .thegreatfrederickfair.com \
  mobile.map-dynamics.com \
  .supabase.co

http_access deny !runner_clients
http_access deny !CONNECT
http_access deny !TLS_port
# Reject an unapproved hostname before the address ACL asks Squid to resolve it.
# This keeps denied CONNECT hostnames from becoming a DNS exfiltration channel.
http_access deny !approved_destination
http_access deny forbidden_destination
http_access allow approved_destination
http_access deny all

cache deny all
cache_store_log none
access_log stdio:/dev/stdout
cache_log /dev/stderr
pid_filename /tmp/squid.pid
netdb_filename none
pinger_enable off
coredump_dir /tmp
shutdown_lifetime 3 seconds
